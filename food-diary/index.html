<style>
:root{--bg:#f6f8f4;--card:#fff;--ink:#1f2b22;--muted:#6e796f;--line:#dfe7df;--green:#2f7b4b;--green2:#e9f4ec;--red:#a64a46;--shadow:0 8px 26px rgba(40,70,50,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}.app{max-width:980px;margin:auto;padding:16px 14px 92px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.top h1{margin:0;font-size:27px}.top p{margin:5px 0;color:var(--muted);font-size:14px}.date{border:1px solid var(--line);border-radius:14px;background:#fff;padding:9px 11px;min-width:135px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow)}.card h2{font-size:18px;margin:0 0 12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{border:1px solid var(--line);background:#fbfcfa;border-radius:13px;padding:10px}.stat b{font-size:23px}.stat small{display:block;color:var(--muted);margin-top:2px}.scoreline{display:flex;align-items:center;gap:14px}.ring{--p:0;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--green) calc(var(--p)*1%),#e7ece8 0)}.ring:after{content:"";position:absolute;inset:8px;border-radius:50%;background:#fff}.ring b{z-index:1;font-size:22px}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:var(--green2);color:var(--green);font-weight:800;font-size:13px}.muted{color:var(--muted);font-size:13px;line-height:1.55}.meals{display:grid;gap:10px}.meal{display:grid;grid-template-columns:92px 1fr auto;gap:11px;align-items:center;border:1px solid var(--line);border-radius:15px;padding:10px}.thumb{width:92px;height:76px;border-radius:11px;object-fit:cover;background:#edf1ed}.meal h3{font-size:16px;margin:0 0 4px}.meal p{font-size:13px;color:var(--muted);margin:0}button{font:inherit;cursor:pointer}.btn{border:0;border-radius:13px;padding:11px 13px;font-weight:800}.primary{background:var(--green);color:#fff}.ghost{background:#f7faf7;color:var(--green);border:1px solid #bfd2c4}.danger{background:#fff4f3;color:var(--red);border:1px solid #ecc9c6}.wide{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap}.water{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.cups{font-size:27px;font-weight:800}.bars{display:grid;gap:9px}.barrow{display:grid;grid-template-columns:85px 1fr 42px;gap:8px;align-items:center;font-size:13px}.bar{height:8px;border-radius:999px;background:#e9eeea;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:999px}.days{display:grid;gap:8px}.day{display:grid;grid-template-columns:80px 1fr 42px;gap:8px;align-items:center;font-size:13px}.modal{position:fixed;inset:0;background:rgba(20,30,24,.48);display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{width:min(700px,100%);max-height:92vh;overflow:auto;background:white;border-radius:22px 22px 0 0;padding:17px}.sheet h2{margin:0 0 12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field label{font-size:13px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.field textarea{min-height:78px;resize:vertical}.full{grid-column:1/-1}.photoPreview{width:100%;max-height:280px;object-fit:contain;border-radius:14px;background:#f1f3f1;display:none}.notice{padding:10px 12px;border-radius:12px;background:#f8fbf8;border:1px solid var(--line);font-size:13px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#243228;color:#fff;border-radius:999px;padding:9px 14px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:9px 14px calc(9px + env(safe-area-inset-bottom));z-index:10}.bottomin{max-width:980px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.bottom button{border:0;background:transparent;padding:8px;color:var(--muted);font-weight:800}.bottom button.active{color:var(--green)}.section{display:none}.section.active{display:block}@media(max-width:760px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.top{align-items:center}.top h1{font-size:23px}.meal{grid-template-columns:82px 1fr}.thumb{width:82px;height:70px}.formgrid{grid-template-columns:1fr}.full{grid-column:1}.sheet{border-radius:20px 20px 0 0}}@media(min-width:761px){.modal{align-items:center}.sheet{border-radius:22px}}
</style></head><body>
<div class="app"><div class="top"><div><h1>🥗 低碳飲食日記 V2</h1><p>拍照、記錄、追蹤；照片改用 IndexedDB 保存。</p></div><div class="date"><small>今天</small><div id="todayText"></div></div></div>
<section id="home" class="section active"><div class="grid"><div class="card"><h2>今日飲食</h2><div id="mealList" class="meals"></div><button class="btn primary wide" id="addMealBtn" style="margin-top:10px">📷 拍照／新增餐點</button></div><div style="display:grid;gap:14px"><div class="card"><h2>今日低碳指標</h2><div class="scoreline"><div class="ring" id="scoreRing"><b id="scoreNum">--</b></div><div><span class="pill" id="scoreLabel">尚未記錄</span><div class="muted" id="scoreHint" style="margin-top:6px">新增餐點後會自動整理。</div></div></div></div><div class="card"><h2>今日摘要</h2><div class="stats"><div class="stat"><b id="mealCount">0</b><small>餐點</small></div><div class="stat"><b id="proteinCount">0</b><small>蛋白質</small></div><div class="stat"><b id="vegCount">0</b><small>蔬菜</small></div><div class="stat"><b id="waterCount">0</b><small>杯水</small></div></div></div><div class="card"><h2>💧 喝水</h2><div class="water"><div><div class="cups"><span id="cups">0</span> 杯</div><div class="muted">每杯約 250 mL</div></div><div class="row"><button class="btn ghost" id="minusWater">−</button><button class="btn primary" id="plusWater">＋</button></div></div></div></div></div><div class="card" style="margin-top:14px"><h2>營養方向</h2><div class="bars"><div class="barrow"><span>蛋白質</span><div class="bar"><i id="proteinBar"></i></div><b id="proteinPct">0%</b></div><div class="barrow"><span>蔬菜纖維</span><div class="bar"><i id="vegBar"></i></div><b id="vegPct">0%</b></div><div class="barrow"><span>低精緻澱粉</span><div class="bar"><i id="carbBar"></i></div><b id="carbPct">0%</b></div><div class="barrow"><span>低糖飲</span><div class="bar"><i id="sugarBar"></i></div><b id="sugarPct">0%</b></div></div><div class="notice" id="dailyAdvice" style="margin-top:12px">今天還沒有足夠資料。</div></div></section>
<section id="history" class="section"><div class="card"><h2>近 7 天</h2><div id="days" class="days"></div></div></section><section id="settings" class="section"><div class="card"><h2>設定與備份</h2><div class="formgrid"><div class="field full"><label>AI 分析後端網址</label><input id="apiBase" placeholder="例如：https://你的-worker.workers.dev"></div><div class="field full"><div class="notice">API 金鑰不要填在這裡。沒有設定後端時，本頁仍可正常拍照、儲存與文字分析。</div></div><div class="full row"><button class="btn ghost" id="exportBtn">匯出備份 JSON</button><label class="btn ghost">匯入備份<input id="importInput" type="file" accept="application/json" hidden></label><button class="btn danger" id="clearBtn">清除全部資料</button></div></div></div></section></div>
<div class="bottom"><div class="bottomin"><button data-tab="home" class="active">今日</button><button data-tab="history">7 天</button><button data-tab="settings">設定</button></div></div><div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="sheet"><h2>新增餐點</h2><div class="formgrid"><div class="field"><label>餐別</label><select id="mealType"><option>早餐</option><option>午餐</option><option>晚餐</option><option>點心</option><option>飲料</option></select></div><div class="field"><label>時間</label><input id="mealTime" type="time"></div><div class="field full"><label>拍照或選照片</label><input id="photoInput" type="file" accept="image/*" capture="environment"><img id="photoPreview" class="photoPreview"></div><div class="field full"><label>你吃了什麼</label><textarea id="foodText" placeholder="例：雞腿、蛋、花椰菜、半碗飯、無糖茶"></textarea></div><div class="field"><label>份量</label><select id="portion"><option value="small">少量</option><option value="normal" selected>一般</option><option value="large">偏多</option></select></div><div class="field"><label>飽足感</label><select id="fullness"><option value="5">5 分</option><option value="7" selected>7 分</option><option value="9">9 分</option></select></div><div class="field full"><label>AI 照片分析</label><button class="btn ghost wide" id="aiBtn" type="button">✨ 讓 AI 看照片並分析</button><div id="aiResult" class="notice" style="margin-top:7px">尚未分析。若未設定 AI 後端，仍可直接儲存。</div></div><div class="full row"><button class="btn primary" id="saveMealBtn">儲存餐點</button><button class="btn ghost" id="cancelBtn">取消</button></div></div></div></div>
<script>
const DB='lowcarb-diary-v2',VER=1;let db,selectedBlob=null,aiAnalysis=null;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const dateKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,today=dateKey();function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('meals')){const s=d.createObjectStore('meals',{keyPath:'id'});s.createIndex('date','date')}if(!d.objectStoreNames.contains('days'))d.createObjectStore('days',{keyPath:'date'});if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'})};r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}function tx(s,m='readonly'){return db.transaction(s,m).objectStore(s)}function put(s,v){return new Promise((res,rej)=>{const r=tx(s,'readwrite').put(v);r.onsuccess=()=>res(v);r.onerror=()=>rej(r.error)})}function get(s,k){return new Promise((res,rej)=>{const r=tx(s).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function del(s,k){return new Promise((res,rej)=>{const r=tx(s,'readwrite').delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function all(s){return new Promise((res,rej)=>{const r=tx(s).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}function mealsForDate(d){return new Promise((res,rej)=>{const r=tx('meals').index('date').getAll(d);r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}async function compressImage(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(url);b?res(b):rej(new Error('壓縮失敗'))},'image/jpeg',.72)};img.onerror=()=>rej(new Error('照片讀取失敗'));img.src=url})}function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)})}function sig(text=''){const t=text.toLowerCase(),h=a=>a.some(x=>t.includes(x));return{protein:h(['雞','牛','豬','魚','蝦','蛋','豆腐','豆漿','優格','乳酪','鮪魚','鮭魚','肉']),veg:h(['菜','花椰菜','青江菜','菠菜','生菜','菇','筍','瓜','番茄','高麗菜','蔬菜']),starch:h(['飯','麵','麵包','吐司','粥','餅','地瓜','馬鈴薯','玉米','冬粉','水餃','包子']),sugar:h(['糖','甜','奶茶','可樂','果汁','珍珠','手搖','冰淇淋','蛋糕','餅乾']),unsweet:h(['無糖','黑咖啡','茶','水'])}}function mealScore(m){if(m.ai&&typeof m.ai.score==='number')return Math.max(0,Math.min(100,m.ai.score));const s=sig(m.text);let v=70;if(s.protein)v+=10;if(s.veg)v+=10;if(s.starch)v-=8;if(s.sugar)v-=18;if(s.unsweet)v+=4;if(m.portion==='large')v-=4;return Math.max(25,Math.min(100,v))}function aggregate(ms){if(!ms.length)return{score:0,p:0,v:0,c:0,s:0,protein:0,veg:0};let total=0,p=0,v=0,st=0,sug=0,protein=0,veg=0;for(const m of ms){total+=mealScore(m);const x=sig(m.text+(m.ai?.summary||''));if(x.protein){p++;protein++}if(x.veg){v++;veg++}if(x.starch)st++;if(x.sugar)sug++}const n=ms.length;return{score:Math.round(total/n),p:Math.round(p/n*100),v:Math.round(v/n*100),c:Math.max(0,100-Math.round(st/n*70)),s:Math.max(0,100-Math.round(sug/n*100)),protein,veg}}async function dayData(d){return(await get('days',d))||{date:d,water:0}}async function setWater(n){const d=await dayData(today);d.water=Math.max(0,n);await put('days',d);render()}function advice(a,ms){if(!ms.length)return'今天還沒有足夠資料。';const t=[];if(a.p<60)t.push('蛋白質可再補一份，例如蛋、魚、雞肉、豆腐或無糖豆漿');if(a.v<60)t.push('蔬菜纖維偏少，下一餐可加深綠色蔬菜或菇類');if(a.c<60)t.push('精緻澱粉稍高，可把飯麵減量');if(a.s<70)t.push('甜食或含糖飲較多，後續改成水或無糖飲');return t.length?t.join('；')+'。':'目前方向不錯：維持蛋白質、蔬菜與無糖飲，留意總份量即可。'}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}async function render(){const ms=(await mealsForDate(today)).sort((a,b)=>a.time.localeCompare(b.time)),day=await dayData(today),a=aggregate(ms);$('#mealCount').textContent=ms.length;$('#proteinCount').textContent=a.protein;$('#vegCount').textContent=a.veg;$('#waterCount').textContent=$('#cups').textContent=day.water||0;$('#scoreNum').textContent=ms.length?a.score:'--';$('#scoreRing').style.setProperty('--p',ms.length?a.score:0);$('#scoreLabel').textContent=!ms.length?'尚未記錄':a.score>=85?'很不錯 👍':a.score>=70?'大致平衡':a.score>=55?'可再調整':'今天需注意';$('#scoreHint').textContent=!ms.length?'新增餐點後會自動整理。':`依目前 ${ms.length} 筆餐點估算。`;for(const[id,val]of[['protein',a.p],['veg',a.v],['carb',a.c],['sugar',a.s]]){$(`#${id}Bar`).style.width=val+'%';$(`#${id}Pct`).textContent=val+'%'}$('#dailyAdvice').textContent=advice(a,ms);const list=$('#mealList');list.innerHTML=ms.length?'':'<div class="notice">今天尚未記錄。新版照片會自動壓縮並保存在 IndexedDB。</div>';for(const m of ms){const el=document.createElement('div');el.className='meal';let url=m.photo?URL.createObjectURL(m.photo):'';el.innerHTML=`${url?`<img class="thumb" src="${url}">`:'<div class="thumb" style="display:grid;place-items:center">🍽️</div>'}<div><h3>${m.type} · ${m.time}</h3><p>${esc(m.text||m.ai?.summary||'已記錄照片')}</p></div><button class="btn danger" data-del="${m.id}">刪除</button>`;list.appendChild(el)}$$('[data-del]').forEach(b=>b.onclick=async()=>{await del('meals',b.dataset.del);toast('已刪除');render()});renderHistory()}async function renderHistory(){const box=$('#days');box.innerHTML='';for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const k=dateKey(d),ms=await mealsForDate(k),a=aggregate(ms),day=await dayData(k),el=document.createElement('div');el.className='day';el.innerHTML=`<b>${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}</b><div class="bar"><i style="width:${ms.length?a.score:0}%"></i></div><span>${ms.length?a.score:'--'}${day.water?` · 💧${day.water}`:''}</span>`;box.appendChild(el)}}function openModal(){selectedBlob=null;aiAnalysis=null;$('#photoInput').value='';$('#photoPreview').style.display='none';$('#foodText').value='';$('#aiResult').textContent='尚未分析。若未設定 AI 後端，仍可直接儲存。';$('#mealTime').value=new Date().toTimeString().slice(0,5);$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}$('#photoInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{selectedBlob=await compressImage(f);$('#photoPreview').src=URL.createObjectURL(selectedBlob);$('#photoPreview').style.display='block';toast(`照片已準備儲存 · ${Math.round(selectedBlob.size/1024)} KB`)}catch(err){toast('照片處理失敗：'+err.message)}};$('#aiBtn').onclick=async()=>{if(!selectedBlob){toast('請先拍照');return}const s=await get('settings','apiBase'),base=(s?.value||'').replace(/\/$/,'');if(!base){$('#aiResult').textContent='尚未設定 AI 後端。先儲存餐點也沒問題。';return}$('#aiBtn').disabled=true;$('#aiResult').textContent='AI 分析中…';try{const dataUrl=await blobToDataURL(selectedBlob),r=await fetch(base+'/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:dataUrl,note:$('#foodText').value,type:$('#mealType').value})});if(!r.ok)throw new Error(await r.text());aiAnalysis=await r.json();$('#aiResult').textContent=`${aiAnalysis.summary||'分析完成'}｜低碳分數 ${aiAnalysis.score??'--'}｜建議：${aiAnalysis.advice||'—'}`;if(!$('#foodText').value&&aiAnalysis.foods?.length)$('#foodText').value=aiAnalysis.foods.join('、')}catch(e){$('#aiResult').textContent='AI 分析失敗：'+e.message}finally{$('#aiBtn').disabled=false}};$('#saveMealBtn').onclick=async()=>{if(!selectedBlob&&!$('#foodText').value.trim()){toast('請拍照或輸入餐點內容');return}try{await put('meals',{id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),date:today,type:$('#mealType').value,time:$('#mealTime').value||'--:--',text:$('#foodText').value.trim(),portion:$('#portion').value,fullness:Number($('#fullness').value),photo:selectedBlob,ai:aiAnalysis,createdAt:Date.now()});closeModal();toast('餐點與照片已儲存');render()}catch(e){toast('儲存失敗：'+e.message)}};$('#plusWater').onclick=async()=>{const d=await dayData(today);setWater((d.water||0)+1)};$('#minusWater').onclick=async()=>{const d=await dayData(today);setWater((d.water||0)-1)};$('#addMealBtn').onclick=openModal;$('#cancelBtn').onclick=closeModal;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};$$('.bottom button').forEach(b=>b.onclick=()=>{$$('.bottom button').forEach(x=>x.classList.toggle('active',x===b));$$('.section').forEach(s=>s.classList.toggle('active',s.id===b.dataset.tab));if(b.dataset.tab==='settings')loadSettings()});async function loadSettings(){const s=await get('settings','apiBase');$('#apiBase').value=s?.value||''}$('#apiBase').onchange=async e=>{await put('settings',{key:'apiBase',value:e.target.value.trim()});toast('AI 後端網址已儲存')};$('#exportBtn').onclick=async()=>{const meals=await all('meals'),days=await all('days'),out=[];for(const m of meals)out.push({...m,photo:m.photo?await blobToDataURL(m.photo):null});const blob=new Blob([JSON.stringify({version:2,meals:out,days},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`lowcarb-diary-backup-${today}.json`;a.click()};$('#importInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());for(const d of data.days||[])await put('days',d);for(const m of data.meals||[]){if(typeof m.photo==='string'&&m.photo.startsWith('data:'))m.photo=await(await fetch(m.photo)).blob();await put('meals',m)}toast('備份已匯入');render()}catch(err){toast('匯入失敗：'+err.message)}};$('#clearBtn').onclick=async()=>{if(!confirm('確定清除全部飲食紀錄與照片？'))return;await new Promise((res,rej)=>{const t=db.transaction(['meals','days'],'readwrite');t.objectStore('meals').clear();t.objectStore('days').clear();t.oncomplete=res;t.onerror=()=>rej(t.error)});toast('已清除');render()};(async()=>{try{await openDB();$('#todayText').textContent=new Intl.DateTimeFormat('zh-TW',{month:'2-digit',day:'2-digit',weekday:'short'}).format(new Date());await render()}catch(e){alert('資料庫初始化失敗：'+e.message)}})();
