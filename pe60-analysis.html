<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>60日均價滾動本益比｜V2</title><style>:root{--bg:#f4f7fb;--card:#fff;--text:#182230;--muted:#667085;--line:#dfe5ec;--blue:#2166d1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei",Arial,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px}.top{max-width:1500px;margin:auto;display:flex;justify-content:space-between;gap:10px;align-items:center}.title{font-size:26px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:4px}.btn{display:inline-block;text-decoration:none;background:#eef3fb;color:#234;border-radius:8px;padding:9px 13px;font-weight:800}.wrap{max-width:1500px;margin:auto;padding:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 4px 14px #243b5310}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.stock{font-size:22px;font-weight:900}.price{font-size:27px;font-weight:900}.meta{font-size:12px;color:var(--muted)}.gauge{height:16px;border-radius:99px;background:linear-gradient(90deg,#58b96a 0 16.6%,#b9dc73 16.6% 33.2%,#76aeea 33.2% 49.8%,#f0cf57 49.8% 66.4%,#ed8b4b 66.4% 83%,#df4545 83% 100%);position:relative;margin:16px 3px 8px}.needle{position:absolute;top:-7px;width:4px;height:30px;background:#111;border-radius:3px}.bands{width:100%;border-collapse:collapse;margin-top:13px;font-size:13px}.bands th,.bands td{border:1px solid #d8dee7;padding:7px;text-align:center}.bands th{background:#f6f7f9}.crazy{background:#e57373}.expensive{background:#f3c8c4}.fair1{background:#8fb8ef}.fair2{background:#dceafa}.cheap{background:#dcedbd}.sale{background:#8fcf7b}.tag{font-size:12px;font-weight:900;border-radius:99px;padding:5px 9px;background:#eef3fb}.note{margin-top:10px;background:#fff9e8;border:1px solid #f0d27b;border-radius:9px;padding:10px;font-size:12px;line-height:1.7}.summary{margin-bottom:14px}.legend{font-size:12px;color:var(--muted);line-height:1.8}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.title{font-size:21px}}</style></head><body><header><div class="top"><div><div class="title">60日均價滾動本益比｜獨立分析</div><div class="sub">台股智慧市場儀表板 V2｜把持股與研究標的放在同一套估值尺上比較</div></div><a class="btn" href="index.html">← 回 V2 儀表板</a></div></header><main class="wrap"><section class="card summary"><b>估值方法</b><div class="legend">以每檔股票「60日平均滾動本益比」作為估值中樞，再依原 V2 六段估值模型切成：特價、便宜、合理下緣、合理上緣、昂貴、瘋狂。<br>本頁第一版先同步 V2 已有且可確認的估值資料；後續股票資料更新時可擴充成自動同步所有持股／CPO研究池。</div></section><div class="grid" id="grid"></div></main><script>const stocks=[{c:'3008',n:'大立光',p:7065,eps:188,pe60:23.82,peNow:37.58,b:[35.73,32.92,28.59,23.82,19.06,14.72],v:[6717.50,6189.06,5374.00,4478.33,3582.67,2767.61]},{c:'6510',n:'精測',p:2800,eps:42.45,pe60:65.96,b:[125.96,109.37,91.14,72.91,56.32],v:[5803.1,5346.8,4642.7,3868.9,3095.1,2391]},{c:'3044',n:'健鼎',p:441.5,eps:25.15,pe60:20.99,v:[792,660,528,475.2,396,264]},{c:'2454',n:'聯發科',p:4020,eps:60.67,pe60:63.4,b:[87.62,76.08,63.4,50.72,39.18],v:[5769.9,5315.8,4615.8,3846.5,3077.2,2377.1]}];const labels=['瘋狂價','昂貴價','合理價（上緣）','合理價（下緣）','便宜價','特價'],cls=['crazy','expensive','fair1','fair2','cheap','sale'];function state(s){let v=s.v,p=s.p;if(p>=v[0])return '瘋狂';if(p>=v[1])return '昂貴';if(p>=v[3])return '合理';if(p>=v[4])return '便宜';return '特價'}function card(s){let lo=s.v[5],hi=s.v[0],pos=Math.max(0,Math.min(100,(s.p-lo)/(hi-lo)*100));let now=s.peNow||s.p/s.eps;return `<section class="card"><div class="head"><div><div class="stock">${s.c} ${s.n}</div><div class="meta">近4季／模型 EPS ${s.eps.toFixed(2)}</div></div><div style="text-align:right"><div class="price">${s.p.toLocaleString()}</div><span class="tag">目前：${state(s)}</span></div></div><div style="margin-top:15px"><b>目前本益比 ${now.toFixed(2)} 倍</b>　<span class="meta">60日估值中樞 ${s.pe60.toFixed(2)} 倍</span></div><div class="gauge"><i class="needle" style="left:${pos}%"></i></div><table class="bands"><thead><tr><th>區間</th><th>估值價格</th></tr></thead><tbody>${labels.map((x,i)=>`<tr><td class="${cls[i]}">${x}</td><td>${s.v[i].toLocaleString(undefined,{maximumFractionDigits:2})}</td></tr>`).join('')}</tbody></table><div class="note">判讀重點：不是看到「便宜」就買、看到「昂貴」就賣；要搭配 EPS 是否上修、產業趨勢、籌碼與重大事件。估值帶會隨 60 日 PE 與 EPS 滾動而移動。</div></section>`}document.getElementById('grid').innerHTML=stocks.map(card).join('');</script></body></html>
