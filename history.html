<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P/C與CNN恐懼貪婪歷史紀錄</title>
<style>:root{--bg:#f4f7fb;--card:#fff;--text:#182230;--muted:#667085;--line:#dfe5ec;--blue:#2166d1;--orange:#f59e0b;--purple:#7c3aed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px}.top{max-width:1450px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:25px;font-weight:900}.small{font-size:12px;color:var(--muted)}.btn{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:9px 13px;font-weight:800;cursor:pointer;text-decoration:none}.btn.light{background:#eef3fb;color:#234}.wrap{max-width:1450px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;padding:10px 18px;border-radius:9px;font-weight:800;cursor:pointer}.tab.active{background:var(--blue);color:#fff}.sec{font-size:20px;font-weight:900;margin:20px 0 9px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 4px 14px #243b5310}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric span{font-size:12px;color:var(--muted)}.metric b{font-size:23px;display:block;margin-top:5px}.chart{height:280px}.chart svg{width:100%;height:100%}.legend{font-size:12px;color:var(--muted);margin-top:7px}.tablewrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;min-width:980px}.tbl th,.tbl td{padding:9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-size:13px}.tbl th:first-child,.tbl td:first-child{text-align:left}.source{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}.settle{display:inline-flex;align-items:center;margin-left:5px;padding:2px 6px;border-radius:999px;font-size:11px;font-weight:900;vertical-align:middle}.settle.week{background:#eaf2ff;color:#175cd3}.settle.month{background:#fff1e7;color:#c2410c;border:1px solid #fdba74}.warn{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:8px;padding:8px 10px;font-size:12px}@media(max-width:800px){.top{flex-direction:column;align-items:flex-start}.summary{grid-template-columns:1fr 1fr}.wrap{padding:9px}.title{font-size:21px}}@media(max-width:480px){.summary{grid-template-columns:1fr}.tab{flex:1}}</style></head>
<body><header><div class="top"><div><div class="title">P/C＋CNN Fear & Greed 歷史紀錄</div><div class="small">每日紀錄｜每週平均／最高／最低／週末值｜每月平均／最高／最低／月底值</div></div><a class="btn light" href="index.html">← 回主儀表板</a></div></header>
<main class="wrap"><div class="source"><div class="tabs"><button class="tab active" data-mode="daily">每日紀錄</button><button class="tab" data-mode="weekly">每週紀錄</button><button class="tab" data-mode="monthly">每月紀錄</button></div><div class="small" id="status">載入中…</div></div>
<div class="sec">① 台指選擇權P/C（臺灣期交所）</div><div class="summary" id="pcSummary"></div><div class="card" style="margin-top:10px"><div class="chart" id="pcChart"></div><div class="legend">藍線＝成交量P/C　｜　橘線＝未平倉量P/C；只統計有通過交易日驗證的資料。</div></div><div class="card tablewrap" style="margin-top:10px"><table class="tbl"><thead id="pcHead"></thead><tbody id="pcBody"></tbody></table></div>
<div class="sec">② CNN Fear & Greed（美股）</div><div class="summary" id="cnnSummary"></div><div class="card" style="margin-top:10px"><div class="chart" id="cnnChart"></div><div class="legend">紫線＝CNN Fear & Greed；0–24極度恐懼、25–44恐懼、45–55中性、56–75貪婪、76–100極度貪婪。</div></div><div class="card tablewrap" style="margin-top:10px"><table class="tbl"><thead id="cnnHead"></thead><tbody id="cnnBody"></tbody></table></div>
<p class="warn">CNN Fear & Greed反映美國股票市場情緒，不是台股情緒指數；P/C則為臺灣期交所臺指選擇權資料。</p></main>
<script>
let mode='daily',market=[],cnn=[];const $=id=>document.getElementById(id),valid=v=>v!==null&&v!==undefined&&Number.isFinite(Number(v)),F=(v,d=2)=>valid(v)?Number(v).toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
function labelCNN(v){return !valid(v)?'—':v<25?'極度恐懼':v<45?'恐懼':v<56?'中性':v<76?'貪婪':'極度貪婪'}
function settlementBadges(date){const d=new Date(date+'T12:00:00Z'),day=d.getUTCDate(),dow=d.getUTCDay(),nth=Math.ceil(day/7),badges=[];if(dow===3){badges.push('<span class="settle week">W'+nth+' 週結算</span>');if(nth===3)badges.push('<span class="settle month">月結算</span>')}else if(dow===5)badges.push('<span class="settle week">F'+nth+' 週結算</span>');return badges.join('')}
function isoWeek(date){const d=new Date(date+'T12:00:00Z'),day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return d.getUTCFullYear()+'-W'+String(Math.ceil((((d-y)/86400000)+1)/7)).padStart(2,'0')}
function keyOf(date,m){return m==='weekly'?isoWeek(date):m==='monthly'?date.slice(0,7):date}
function agg(rows,fields,m){if(m==='daily')return rows.map(r=>({key:r.date,start:r.date,end:r.date,...Object.fromEntries(fields.map(f=>[f,r[f]]))}));const groups={};rows.forEach(r=>{const k=keyOf(r.date,m);(groups[k]??=[]).push(r)});return Object.entries(groups).sort().map(([key,rs])=>{rs.sort((a,b)=>a.date.localeCompare(b.date));const o={key,start:rs[0].date,end:rs.at(-1).date};fields.forEach(f=>{const a=rs.filter(x=>valid(x[f])).map(x=>Number(x[f]));o[f+'Avg']=a.length?a.reduce((x,y)=>x+y,0)/a.length:null;o[f+'High']=a.length?Math.max(...a):null;o[f+'Low']=a.length?Math.min(...a):null;const last=[...rs].reverse().find(x=>valid(x[f]));o[f+'End']=last?Number(last[f]):null});return o})}
function stats(rows,field){const a=rows.map(r=>r[field]).filter(valid).map(Number);return{count:a.length,avg:a.length?a.reduce((x,y)=>x+y,0)/a.length:null,high:a.length?Math.max(...a):null,low:a.length?Math.min(...a):null,last:a.at(-1)}}
function cards(el,items){$(el).innerHTML=items.map(x=>'<div class="card metric"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')}
function chart(el,rows,series,colors){const usable=rows.filter(r=>series.some(s=>valid(r[s]))).slice(-60);if(!usable.length){$(el).innerHTML='<div style="padding:50px;color:#667085">尚無有效資料</div>';return}const w=1000,h=250,p=38,vals=usable.flatMap(r=>series.map(s=>r[s]).filter(valid).map(Number)),min=Math.min(...vals),max=Math.max(...vals),pad=Math.max((max-min)*.12,.05),lo=min-pad,hi=max+pad,x=i=>p+(w-2*p)*(usable.length===1?.5:i/(usable.length-1)),y=v=>h-p-(v-lo)/(hi-lo)*(h-2*p);let lines=series.map((s,j)=>'<polyline fill="none" stroke="'+colors[j]+'" stroke-width="3" points="'+usable.map((r,i)=>valid(r[s])?x(i)+','+y(Number(r[s])):'').filter(Boolean).join(' ')+'"/>').join('');let labels=usable.map((r,i)=>i%Math.max(1,Math.ceil(usable.length/8))===0?'<text x="'+x(i)+'" y="'+(h-8)+'" text-anchor="middle" font-size="10" fill="#667085">'+r.key.slice(5)+'</text>':'').join('');$(el).innerHTML='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+lines+labels+'</svg>'}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));const pcRaw=market.map(r=>({date:r.date,trade:r.pc?.trade,oi:r.pc?.oi})).filter(r=>valid(r.trade)||valid(r.oi)),cnnRaw=cnn.map(r=>({date:r.date,score:r.score,rating:r.rating})).filter(r=>valid(r.score));const pc=agg(pcRaw,['trade','oi'],mode),cg=agg(cnnRaw,['score'],mode),suffix=mode==='daily'?'':mode==='weekly'?'End':'End';
const ps=stats(pcRaw,'trade'),po=stats(pcRaw,'oi'),cs=stats(cnnRaw,'score');cards('pcSummary',[['有效交易日',ps.count+' 日'],['成交比平均',F(ps.avg)],['未平倉比平均',F(po.avg)],['最新未平倉比',F(po.last)]]);cards('cnnSummary',[['有效交易日',cs.count+' 日'],['CNN平均',F(cs.avg,1)],['最高／最低',F(cs.high,1)+'／'+F(cs.low,1)],['最新值',F(cs.last,0)+' '+labelCNN(cs.last)]]);
if(mode==='daily'){pcHead.innerHTML='<tr><th>日期</th><th>成交量P/C</th><th>未平倉量P/C</th></tr>';pcBody.innerHTML=pc.slice().reverse().map(r=>'<tr><td>'+r.key+settlementBadges(r.key)+'</td><td>'+F(r.trade)+'</td><td>'+F(r.oi)+'</td></tr>').join('');cnnHead.innerHTML='<tr><th>日期</th><th>CNN指數</th><th>判讀</th></tr>';cnnBody.innerHTML=cg.slice().reverse().map(r=>'<tr><td>'+r.key+'</td><td>'+F(r.score,1)+'</td><td>'+labelCNN(r.score)+'</td></tr>').join('');chart('pcChart',pc,['trade','oi'],['#2166d1','#f59e0b']);chart('cnnChart',cg,['score'],['#7c3aed'])}
else{const endName=mode==='weekly'?'週末值':'月底值';pcHead.innerHTML='<tr><th>期間</th><th>成交平均</th><th>最高</th><th>最低</th><th>'+endName+'</th><th>OI平均</th><th>最高</th><th>最低</th><th>'+endName+'</th></tr>';pcBody.innerHTML=pc.slice().reverse().map(r=>'<tr><td>'+r.key+'<br><small>'+r.start+'～'+r.end+'</small></td><td>'+F(r.tradeAvg)+'</td><td>'+F(r.tradeHigh)+'</td><td>'+F(r.tradeLow)+'</td><td>'+F(r.tradeEnd)+'</td><td>'+F(r.oiAvg)+'</td><td>'+F(r.oiHigh)+'</td><td>'+F(r.oiLow)+'</td><td>'+F(r.oiEnd)+'</td></tr>').join('');cnnHead.innerHTML='<tr><th>期間</th><th>平均</th><th>最高</th><th>最低</th><th>'+endName+'</th><th>月底／週末判讀</th></tr>';cnnBody.innerHTML=cg.slice().reverse().map(r=>'<tr><td>'+r.key+'<br><small>'+r.start+'～'+r.end+'</small></td><td>'+F(r.scoreAvg,1)+'</td><td>'+F(r.scoreHigh,1)+'</td><td>'+F(r.scoreLow,1)+'</td><td>'+F(r.scoreEnd,1)+'</td><td>'+labelCNN(r.scoreEnd)+'</td></tr>').join('');chart('pcChart',pc,['tradeAvg','oiAvg'],['#2166d1','#f59e0b']);chart('cnnChart',cg,['scoreAvg'],['#7c3aed'])}}
async function load(){try{const [m,c]=await Promise.all([fetch('market_history.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()),fetch('cnn_fear_greed.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json())]);market=(m.records||[]).sort((a,b)=>a.date.localeCompare(b.date));cnn=(c.records||[]).sort((a,b)=>a.date.localeCompare(b.date));status.textContent='P/C '+market.length+'筆｜CNN '+cnn.length+'筆｜更新 '+(m.updated||'—');render()}catch(e){status.textContent='歷史資料載入中，請稍後重新整理';console.error(e)}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});load();
</script></body></html>
