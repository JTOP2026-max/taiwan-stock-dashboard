<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股歷史紀錄｜P/C 趨勢</title><style>:root{--bg:#f4f7fb;--card:#fff;--text:#182230;--muted:#667085;--line:#e4e9f0;--up:#df1f26;--down:#16834b;--blue:#2166d1;--orange:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px}.top{max-width:1450px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:25px;font-weight:900}.sub,.small{font-size:12px;color:var(--muted)}.btn{display:inline-block;background:#2166d1;color:#fff;text-decoration:none;border-radius:8px;padding:9px 13px;font-weight:800}.wrap{max-width:1450px;margin:auto;padding:16px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.toolbar input,.toolbar select{padding:9px;border:1px solid #ccd4de;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.label{font-size:12px;color:var(--muted)}.num{font-size:25px;font-weight:900;margin-top:5px}.up{color:var(--up)}.down{color:var(--down)}.sec{font-size:20px;font-weight:900;margin:20px 0 10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.chart{height:300px}.chart svg{width:100%;height:100%}.legend{font-size:12px;color:var(--muted);margin-top:8px}.tablewrap{overflow:auto}.history-table{width:100%;min-width:1100px;border-collapse:collapse;font-size:13px}.history-table th,.history-table td{padding:9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.history-table th:first-child,.history-table td:first-child{text-align:left}@media(max-width:1000px){.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:620px){.top{align-items:flex-start;flex-direction:column}.grid,.stats{grid-template-columns:1fr}.title{font-size:21px}.wrap{padding:9px}}</style></head><body><header><div class="top"><div><div class="title">台股每日歷史紀錄＋P/C 趨勢</div><div class="sub">日期回看｜近 5 / 20 / 60 個交易日｜紅漲綠跌</div></div><a class="btn" href="./">← 回主儀表板</a></div></header><main class="wrap"><div class="toolbar"><b>選擇日期</b><input type="date" id="datePick"><b>P/C 統計區間</b><select id="period"><option value="5">近 5 個交易日</option><option value="20">近 20 個交易日</option><option value="60">近 60 個交易日</option></select><span class="small" id="status"></span></div><div class="sec">① 當日市場紀錄</div><div class="grid" id="daily"></div><div class="sec">② P/C Ratio 連續性</div><div class="stats" id="pcStats"></div><div class="card" style="margin-top:10px"><div class="chart" id="chart"></div><div class="legend">藍線＝P/C 成交比　｜　橘線＝P/C 未平倉比。資料每天累積後會自動形成一週／一月／季線趨勢。</div></div><div class="sec">③ 每日紀錄表</div><div class="card tablewrap"><table class="history-table"><thead><tr><th>日期</th><th>加權指數</th><th>漲跌</th><th>成交值(兆)</th><th>三大法人(億)</th><th>外資(億)</th><th>P/C成交比</th><th>P/C未平倉比</th><th>上漲/下跌</th><th>台指夜盤</th><th>情緒</th></tr></thead><tbody id="tbody"></tbody></table></div></main><script>const fallback=[{date:"2026-08-13",index:46021.48,indexChg:503.41,indexPct:1.11,turnoverTrillion:1.05,institutional:907.56,foreign:756.95,pcTrade:1.05,pcOI:1.16,advancers:800,decliners:989,futuresNight:46389,futuresNightChg:364,sentiment:78,sentimentLabel:"偏多但偏熱"}];let H=[];const F=(n,d=2)=>Number(n).toLocaleString('zh-TW',{maximumFractionDigits:d});const S=n=>(Number(n)>=0?'+':'')+F(n);function cls(n){return Number(n)>=0?'up':'down'}function pcLabel(v){return v<.7?'極度偏空':v<1?'偏空':v<1.2?'正常範圍':v<1.35?'偏多':v<1.45?'偏多注意':'最後的煙火／戒慎貪婪'}function renderDaily(r){daily.innerHTML=[['📈 加權指數',F(r.index),`${S(r.indexChg)} 點／${S(r.indexPct)}%`,cls(r.indexChg)],['💰 成交值',F(r.turnoverTrillion)+' 兆元','', ''],['🏦 三大法人',S(r.institutional)+' 億',r.institutional>=0?'買超':'賣超',cls(r.institutional)],['🌏 外資',S(r.foreign)+' 億',r.foreign>=0?'買超':'賣超',cls(r.foreign)],['📊 P/C 成交比',F(r.pcTrade),'', ''],['📊 P/C 未平倉比',F(r.pcOI),pcLabel(r.pcOI),''],['📈 上漲／下跌',F(r.advancers,0)+'／'+F(r.decliners,0),'', ''],['🌙 台指期夜盤',F(r.futuresNight,0),S(r.futuresNightChg),cls(r.futuresNightChg)],['🧠 自訂市場情緒',F(r.sentiment,0)+'/100',r.sentimentLabel||'','']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="num ${x[3]}">${x[1]}</div><div class="${x[3]}">${x[2]}</div></div>`).join('')}function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}function renderPC(){let n=+period.value,rows=H.slice(-n),t=rows.map(r=>r.pcTrade),o=rows.map(r=>r.pcOI),last=rows.at(-1);pcStats.innerHTML=[['區間',rows.length+' 個交易日'],['成交比平均',F(avg(t))],['未平倉比平均',F(avg(o))],['最新判讀',last?pcLabel(last.pcOI):'—']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('');draw(rows)}function draw(rows){if(!rows.length){chart.innerHTML='尚無資料';return}let w=900,h=260,p=36,vals=rows.flatMap(r=>[r.pcTrade,r.pcOI]),min=Math.min(.5,...vals),max=Math.max(1.5,...vals),x=i=>p+(w-2*p)*(rows.length===1?.5:i/(rows.length-1)),y=v=>h-p-(v-min)/(max-min)*(h-2*p),trade=rows.map((r,i)=>`${x(i)},${y(r.pcTrade)}`).join(' '),oi=rows.map((r,i)=>`${x(i)},${y(r.pcOI)}`).join(' '),labels=rows.map((r,i)=>`<text x="${x(i)}" y="${h-8}" text-anchor="middle" font-size="10" fill="#667085">${r.date.slice(5)}</text>`).join('');chart.innerHTML=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="${p}" y1="${y(1)}" x2="${w-p}" y2="${y(1)}" stroke="#d1d5db" stroke-dasharray="4 4"/><line x1="${p}" y1="${y(1.2)}" x2="${w-p}" y2="${y(1.2)}" stroke="#d1d5db" stroke-dasharray="4 4"/><polyline fill="none" stroke="#2166d1" stroke-width="3" points="${trade}"/><polyline fill="none" stroke="#f59e0b" stroke-width="3" points="${oi}"/>${labels}</svg>`}function renderTable(){tbody.innerHTML=H.slice().reverse().map(r=>`<tr><td><button style="border:0;background:none;color:#2166d1;cursor:pointer" onclick="pick('${r.date}')">${r.date}</button></td><td>${F(r.index)}</td><td class="${cls(r.indexChg)}">${S(r.indexChg)} / ${S(r.indexPct)}%</td><td>${F(r.turnoverTrillion)}</td><td class="${cls(r.institutional)}">${S(r.institutional)}</td><td class="${cls(r.foreign)}">${S(r.foreign)}</td><td>${F(r.pcTrade)}</td><td>${F(r.pcOI)}</td><td>${F(r.advancers,0)}/${F(r.decliners,0)}</td><td class="${cls(r.futuresNightChg)}">${F(r.futuresNight,0)} (${S(r.futuresNightChg)})</td><td>${F(r.sentiment,0)}/100 ${r.sentimentLabel||''}</td></tr>`).join('')}function pick(d){datePick.value=d;let r=H.find(x=>x.date===d);if(r)renderDaily(r)}async function load(){try{let r=await fetch('history.json?ts='+Date.now());if(!r.ok)throw 0;H=await r.json()}catch(e){H=fallback}H.sort((a,b)=>a.date.localeCompare(b.date));datePick.min=H[0].date;datePick.max=H.at(-1).date;datePick.value=H.at(-1).date;renderDaily(H.at(-1));renderPC();renderTable();status.textContent='目前已有 '+H.length+' 個交易日紀錄'}datePick.addEventListener('change',()=>pick(datePick.value));period.addEventListener('change',renderPC);load();</script></body></html>
