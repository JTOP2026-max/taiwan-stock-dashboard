<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股智慧市場儀表板 V2</title><style>:root{--bg:#f4f7fb;--card:#fff;--text:#182230;--muted:#667085;--line:#e4e9f0;--up:#df1f26;--down:#16834b;--blue:#2166d1;--warn:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;position:sticky;top:0;z-index:5}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{font-size:27px;font-weight:900}.sub,.small{font-size:12px;color:var(--muted)}.btn{background:#2166d1;color:#fff;border:0;border-radius:8px;padding:9px 13px;font-weight:800;cursor:pointer}.btn.secondary{background:#eef3fb;color:#234}.wrap{max-width:1500px;margin:auto;padding:15px}.sec{font-size:20px;font-weight:900;margin:12px 0 8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.g3{display:grid;grid-template-columns:1fr 2fr 2fr;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 4px 14px #243b5310}.label{font-size:12px;color:var(--muted)}.num{font-size:28px;font-weight:900;margin:5px 0}.up{color:var(--up)}.down{color:var(--down)}.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.gaugebox{display:grid;grid-template-columns:1.15fr .85fr;gap:8px;align-items:center}.gauge{height:195px;position:relative;display:flex;justify-content:center;overflow:hidden}.arc{position:absolute;top:28px;width:250px;height:125px;border-radius:250px 250px 0 0;background:conic-gradient(from 270deg,#2ca35c 0deg,#8bc34a 40deg,#52a9df 70deg,#f2c94c 105deg,#f47721 145deg,#df1f26 180deg)}.arc:after{content:"";position:absolute;left:26px;right:26px;bottom:0;height:98px;background:#fff;border-radius:200px 200px 0 0}.needle{position:absolute;bottom:31px;width:4px;height:87px;background:#111;transform-origin:50% 100%;z-index:2;border-radius:4px}.needle:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#111;bottom:-6px;left:-4px}.gv{position:absolute;bottom:12px;font-size:28px;font-weight:900;z-index:3}.gs{position:absolute;bottom:-11px;font-weight:800;z-index:3}.legend{font-size:12px;line-height:1.75}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.d1{background:#2ca35c}.d2{background:#8bc34a}.d3{background:#52a9df}.d4{background:#f2c94c}.d5{background:#f47721}.d6{background:#df1f26}.tablewrap{overflow:auto}.portfolio table{width:100%;min-width:1050px;border-collapse:collapse;font-size:13px}.portfolio th,.portfolio td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.portfolio th:first-child,.portfolio td:first-child{text-align:left}.badge{padding:4px 8px;border-radius:999px;background:#edf3fc;font-size:11px;font-weight:800}.bar{height:11px;border-radius:20px;background:linear-gradient(90deg,#2ca35c,#8bc34a,#52a9df,#f2c94c,#f47721,#df1f26);position:relative;margin-top:7px}.pin{position:absolute;top:-5px;width:4px;height:21px;background:#111}.advice{background:#fff9e8;border-color:#f0d27b}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.toolbar input{padding:8px 9px;border:1px solid #ccd4de;border-radius:7px;width:120px}.mini{font-size:12px}.danger{background:#fee2e2;color:#991b1b;border:0;border-radius:6px;padding:5px 8px;cursor:pointer}.summary6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}footer{text-align:center;color:#7b8794;font-size:12px;padding:20px}@media(max-width:1100px){.g4,.g3,.summary6{grid-template-columns:1fr 1fr}.gaugebox{grid-template-columns:1fr}}@media(max-width:620px){header{position:static}.top{align-items:flex-start;flex-direction:column}.g4,.g3,.summary6{grid-template-columns:1fr}.title{font-size:21px}.wrap{padding:9px}.toolbar input{width:100%}.toolbar .btn{width:100%}}</style></head><body><header><div class="top"><div><div class="title">台股智慧市場儀表板 V2 <span class="badge">白底完整版</span></div><div class="sub">大盤＋籌碼＋情緒儀表＋盤面強弱＋持股估值｜紅漲綠跌｜手機／桌機同一網址</div></div><div><span id="updated" class="small">資料載入中…</span>　<button class="btn" onclick="loadData()">↻ 重新整理</button></div></div></header><main class="wrap"><div class="sec">① 大盤核心</div><div class="g4" id="core"></div><div class="sec">② 籌碼與市場情緒</div><div class="g3" id="sent"></div><div class="sec">③ 盤面強弱</div><div class="g3" id="breadth"></div><div class="sec">④ 我的持股｜估值模組</div><div class="card portfolio"><div class="toolbar"><input id="code" placeholder="股票代碼"><input id="name" placeholder="股票名稱"><input id="price" type="number" step="0.01" placeholder="現價"><input id="shares" type="number" step="1" placeholder="股數"><input id="avg" type="number" step="0.01" placeholder="成本均價"><button class="btn" onclick="addHolding()">＋新增持股</button><button class="btn secondary" onclick="resetHoldings()">恢復四檔</button></div><div class="small">新增／刪除持股會儲存在目前瀏覽器，方便汰弱留強。新加入的股票先顯示基本持股資料，估值價位可在後續版本改成可編輯。</div><div class="tablewrap" id="holdings"></div></div><div class="sec">⑤ 持股估值總覽</div><div class="summary6" id="summary"></div></main><footer>本儀表板僅供參考，非投資建議。投資有風險，請審慎評估。資料目前為示範快照；正式每日更新會在下一階段接資料來源與排程。</footer><script>const fallback={updated:"2026/08/14 07:30",core:{idx:46021.48,chg:503.41,pct:1.11,vol:"1.05 兆",volPct:2.35,fut:46389,futChg:364,futPct:.79,basis:3.52},inst:{t:907.56,f:756.95,tr:.01,d:150.60},pc:{oi:1.16,trade:1.05},fg:78,b:{u:800,d:989,lu:38,ld:4},leaders:[["台積電 2330",2345,35,1.52],["聯發科 2454",4225,78,1.88],["鴻海 2317",1845,-12,-.65],["台達電 2308",1885,27,1.45],["廣達 2382",2620,-33,-1.24]],market:"偏多，但非全面普漲",h:[{c:"3008",n:"大立光",p:4355,ch:55,pc:1.28,s:45,a:2350,e:188.02,pe:23.16,v:[2985.1,3864.2,4830.2,5796.3,6675.4]},{c:"6510",n:"精測",p:2800,ch:40,pc:1.45,s:250,a:3121.69,e:42.45,pe:65.96,v:[2391,3095.1,3868.9,4642.7,5346.8]},{c:"3044",n:"健鼎",p:441.5,ch:-3.5,pc:-.79,s:1000,a:429.2,e:25.15,pe:20.99,v:[264,396,528,660,792]},{c:"2454",n:"聯發科",p:4020,ch:-20,pc:-.5,s:55,a:3333.82,e:60.67,pe:66.26,v:[2377.1,3077.2,3846.5,4615.8,5315.8]}]};const KEY='tw_v2_holdings_full';let D=JSON.parse(JSON.stringify(fallback));const F=n=>(n===null||n===undefined||isNaN(Number(n)))?'—':Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2}),P=n=>(Number(n)>=0?'+':'')+F(n)+'%';function pcs(v){return v<.7?['極度偏空','down']:v<1?['偏空','down']:v<1.2?['正常範圍','']:v<1.35?['偏多','up']:v<1.45?['偏多注意','up']:['最後的煙火／戒慎貪婪','up']}function fgs(v){return v<30?['市場恐懼','down']:v<50?['市場溫和','']:v<65?['市場樂觀','up']:v<80?['市場樂觀追價','up']:['市場無腦多／小心最後煙火','up']}function gauge(v,min,max,type){let a=-90+(Math.max(min,Math.min(max,v))-min)/(max-min)*180,s=type==='pc'?pcs(v):fgs(v);return `<div class="gauge"><div class="arc"></div><div class="needle" style="transform:rotate(${a}deg)"></div><div class="gv ${s[1]}">${type==='pc'?F(v):F(v)+'/100'}</div><div class="gs ${s[1]}">${s[0]}</div></div>`}function getHoldings(){try{let x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)?x:D.h}catch(e){return D.h}}function saveHoldings(h){localStorage.setItem(KEY,JSON.stringify(h))}function addHolding(){let c=code.value.trim(),n=name.value.trim()||c,p=+price.value,s=+shares.value||0,a=+avg.value||0;if(!c||!p){alert('請至少輸入股票代碼與現價');return}let h=getHoldings();h.push({c,n,p,ch:0,pc:0,s,a,e:null,pe:null,v:[]});saveHoldings(h);renderHoldings(h);code.value=name.value=price.value=shares.value=avg.value=''}function delHolding(i){let h=getHoldings();if(confirm('確定刪除 '+h[i].c+' '+h[i].n+'？')){h.splice(i,1);saveHoldings(h);renderHoldings(h)}}function resetHoldings(){if(confirm('恢復為原始四檔持股？')){saveHoldings(JSON.parse(JSON.stringify(fallback.h)));renderHoldings(getHoldings())}}function valStatus(h){if(!h.v||!h.v.length)return['尚未設定',''];if(h.p<=h.v[0])return['特價','up'];if(h.p<=h.v[1])return['便宜價',''];if(h.p<=h.v[3])return['合理價',''];return['昂貴價','up']}function render(){updated.textContent='資料日期／更新：'+D.updated;let c=D.core;core.innerHTML=[["加權指數",F(c.idx),`▲ ${F(c.chg)}　${P(c.pct)}`],["成交值",c.vol,`較昨日 ${P(c.volPct)}`],["台指期夜盤",F(c.fut),`▲ ${F(c.futChg)}　${P(c.futPct)}`],["台指期正逆價差",(c.basis>=0?'+':'')+F(c.basis),c.basis>=0?'正價差':'逆價差']].map((x,i)=>`<div class="card"><div class="label">${x[0]}</div><div class="num ${i===1?'':'up'}">${x[1]}</div><div class="${i===1?(c.volPct>=0?'up':'down'):(i===3&&c.basis<0?'down':'up')}">${x[2]}</div></div>`).join('');let ps=pcs(D.pc.oi),fs=fgs(D.fg);sent.innerHTML=`<div class="card"><div class="label">三大法人｜最新交易日</div><div class="num ${D.inst.t>=0?'up':'down'}">${D.inst.t>=0?'+':''}${F(D.inst.t)} 億</div><div class="row"><span>外資及陸資</span><b class="${D.inst.f>=0?'up':'down'}">${D.inst.f>=0?'+':''}${F(D.inst.f)} 億</b></div><div class="row"><span>投信</span><b class="${D.inst.tr>=0?'up':'down'}">${D.inst.tr>=0?'+':''}${F(D.inst.tr)} 億</b></div><div class="row"><span>自營商</span><b class="${D.inst.d>=0?'up':'down'}">${D.inst.d>=0?'+':''}${F(D.inst.d)} 億</b></div></div><div class="card"><div class="label">P/C Ratio｜選擇權未平倉</div><div class="gaugebox">${gauge(D.pc.oi,.5,2,'pc')}<div class="legend"><div><span class="dot d1"></span>&lt;0.70 極度偏空</div><div><span class="dot d2"></span>0.70–1.00 偏空</div><div><span class="dot d3"></span>1.00–1.20 正常</div><div><span class="dot d4"></span>1.20–1.35 偏多</div><div><span class="dot d5"></span>1.36–1.45 偏多注意</div><div><span class="dot d6"></span>≥1.45 最後煙火</div></div></div><div class="row"><span>P/C 成交比</span><b>${F(D.pc.trade)}</b></div><div class="row"><span>P/C 未平倉比</span><b>${F(D.pc.oi)}</b></div><div class="row"><span>目前區間</span><b class="${ps[1]}">${ps[0]}</b></div></div><div class="card"><div class="label">台股 Fear & Greed｜模型分數</div><div class="gaugebox">${gauge(D.fg,0,100,'fg')}<div class="legend"><div><span class="dot d1"></span>0–30 市場恐懼</div><div><span class="dot d2"></span>30–50 市場溫和</div><div><span class="dot d4"></span>50–65 市場樂觀</div><div><span class="dot d5"></span>66–79 市場樂觀追價</div><div><span class="dot d6"></span>≥80 市場無腦多</div></div></div><div class="card advice"><b class="${fs[1]}">${fs[0]}</b><br><span class="small">情緒越熱，越要留意追價風險與估值安全邊際。</span></div></div>`;breadth.innerHTML=`<div class="card"><div class="label">上漲／下跌家數</div><div class="num"><span class="up">${F(D.b.u)}</span> / <span class="down">${F(D.b.d)}</span></div><div class="row"><span>上漲家數</span><b class="up">${F(D.b.u)}</b></div><div class="row"><span>下跌家數</span><b class="down">${F(D.b.d)}</b></div><div class="row"><span>漲停家數</span><b class="up">${F(D.b.lu)}</b></div><div class="row"><span>跌停家數</span><b class="down">${F(D.b.ld)}</b></div></div><div class="card"><div class="label">權值股觀察</div>${D.leaders.map(r=>`<div class="row"><span>${r[0]}</span><span>${F(r[1])}　<b class="${r[2]>=0?'up':'down'}">${r[2]>=0?'▲':'▼'} ${F(Math.abs(r[2]))}　${P(r[3])}</b></span></div>`).join('')}</div><div class="card"><div class="label">市場結構</div><div class="num up">${D.market}</div><div class="small">電子權值與部分 AI／半導體族群帶動指數；盤面仍存在類股與個股分化。</div><div class="bar"><div class="pin" style="left:72%"></div></div><div class="small">偏空　　　　　　　　　　　偏多</div></div>`;renderHoldings(getHoldings())}function renderHoldings(hs){let total=0,pnl=0,rows='';hs.forEach((h,i)=>{let gain=(h.p-h.a)*h.s,rate=h.a?(h.p/h.a-1)*100:0;total+=h.p*h.s;pnl+=gain;let st=valStatus(h),v=h.v||[],pos=v.length?Math.max(0,Math.min(100,(h.p-v[0])/(v[4]-v[0])*100)):50;rows+=`<tr><td><b>${h.c} ${h.n}</b><br><button class="danger mini" onclick="delHolding(${i})">刪除／汰弱</button></td><td>${F(h.p)}</td><td class="${h.ch>=0?'up':'down'}">${h.ch>=0?'▲':'▼'} ${F(Math.abs(h.ch))}<br>${P(h.pc)}</td><td>${F(h.s)}</td><td>${F(h.a)}</td><td class="${gain>=0?'up':'down'}">${gain>=0?'+':''}${F(gain)}<br>${P(rate)}</td><td>${F(h.e)}</td><td>${F(h.pe)}</td><td><span class="badge">${st[0]}</span></td></tr><tr><td colspan="9">${v.length?`<div class="small">特價 ${F(v[0])}　便宜價 ${F(v[1])}　合理價(下緣) ${F(v[2])}　合理價(上緣) ${F(v[3])}　昂貴價 ${F(v[4])}</div><div class="bar"><div class="pin" style="left:${pos}%"></div></div>`:'<div class="small">此新增股票尚未設定估值價格帶。</div>'}</td></tr>`});holdings.innerHTML=`<table><thead><tr><th>股票</th><th>現價</th><th>漲跌</th><th>持股</th><th>成本均價</th><th>損益</th><th>EPS</th><th>本益比</th><th>估值</th></tr></thead><tbody>${rows||'<tr><td colspan="9">目前沒有持股</td></tr>'}</tbody></table>`;let low=hs.filter(h=>h.v&&h.v.length&&h.p<=h.v[1]).length,fair=hs.filter(h=>h.v&&h.v.length&&h.p>h.v[1]&&h.p<=h.v[3]).length,high=hs.filter(h=>h.v&&h.v.length&&h.p>h.v[3]).length,fs=fgs(D.fg);summary.innerHTML=[["總持股市值",F(total)+' 元','目前市值'],["總未實現損益",(pnl>=0?'+':'')+F(pnl)+' 元',pnl>=0?'整體獲利':'整體虧損'],["合理價以下",low+' 檔',hs.length?Math.round(low/hs.length*100)+'%':'0%'],["合理價區間",fair+' 檔',hs.length?Math.round(fair/hs.length*100)+'%':'0%'],["昂貴價以上",high+' 檔',hs.length?Math.round(high/hs.length*100)+'%':'0%'],["今日操作建議",fs[0],D.market]].map((x,i)=>`<div class="card ${i===5?'advice':''}"><div class="label">${x[0]}</div><div class="num ${i===1?(pnl>=0?'up':'down'):''}">${x[1]}</div><div class="small">${x[2]}</div></div>`).join('')}async function loadData(){try{let r=await fetch('data.json?ts='+Date.now(),{cache:'no-store'});if(r.ok){let n=await r.json();D={...fallback,...n,h:fallback.h};}}catch(e){}render()}loadData();setInterval(loadData,30*60*1000);</script></body></html>
