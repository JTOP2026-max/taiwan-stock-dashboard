wn'}">${D.inst.f>=0?'+':''}${F(D.inst.f)} 億</b></div><div class="row"><span>投信</span><b class="${D.inst.tr>=0?'up':'down'}">${D.inst.tr>=0?'+':''}${F(D.inst.tr)} 億</b></div><div class="row"><span>自營商</span><b class="${D.inst.d>=0?'up':'down'}">${D.inst.d>=0?'+':''}${F(D.inst.d)} 億</b></div></div><div class="card"><div class="label">P/C Ratio｜選擇權未平倉</div><div class="gaugebox">${gaugeSVG(D.pc.oi,.5,2,'pc')}<div class="legend"><div><span class="dot d1"></span>&lt;0.70 極度偏空</div><div><span class="dot d2"></span>0.70–1.00 偏空</div><div><span class="dot d3"></span>1.00–1.20 正常</div><div><span class="dot d4"></span>1.20–1.35 偏多</div><div><span class="dot d5"></span>1.36–1.45 偏多注意</div><div><span class="dot d6"></span>≥1.45 最後煙火</div></div></div><div class="row"><span>P/C 成交比</span><b>${F(D.pc.trade)}</b></div><div class="row"><span>P/C 未平倉比</span><b>${F(D.pc.oi)}</b></div></div><div class="card"><div class="label">台股 Fear & Greed｜模型分數</div><div class="gaugebox">${gaugeSVG(D.fg,0,100,'fg')}<div class="legend"><div><span class="dot d1"></span>0–30 市場恐懼</div><div><span class="dot d2"></span>30–50 市場溫和</div><div><span class="dot d4"></span>50–65 市場樂觀</div><div><span class="dot d5"></span>66–79 市場樂觀追價</div><div><span class="dot d6"></span>≥80 市場無腦多</div></div></div><div class="card advice"><b class="${fs[1]}">${fs[0]}</b><div class="small">情緒越熱，越要留意追價風險與估值安全邊際。</div></div></div>`;breadth.innerHTML=`<div class="card"><div class="label">上漲／下跌家數</div><div class="num"><span class="up">${F(D.b.u)}</span> / <span class="down">${F(D.b.d)}</span></div><div class="row"><span>漲停</span><b class="up">${F(D.b.lu)}</b></div><div class="row"><span>跌停</span><b class="down">${F(D.b.ld)}</b></div></div><div class="card"><div class="label">權值股觀察</div>${D.leaders.map(r=>`<div class="row"><span>${r[0]}</span><span>${F(r[1])}　<b class="${r[2]>=0?'up':'down'}">${r[2]>=0?'▲':'▼'} ${F(Math.abs(r[2]))}　${P(r[3])}</b></span></div>`).join('')}</div><div class="card"><div class="label">市場結構</div><div class="num up">${D.market}</div><div class="small">電子權值與部分 AI／半導體族群帶動指數；盤面仍存在類股與個股分化。</div></div>`;renderHoldings(getHoldings())}function renderHoldings(hs){holdings.innerHTML=hs.map((h,i)=>{let hp=h.p==null?0:Number(h.p),ha=Number(h.a)||0,hsn=Number(h.s)||0,cost=hsn*ha,pnl=(hp-ha)*hsn,meaning=priceMeaning(h),bands=(h.labels||[]).map((lab,j)=>`<tr><td>${lab}</td><td>${h.v&&h.v[j]!=null?F(h.v[j]):'—'}</td></tr>`).join(''),peRows='';if(h.mults){peRows=h.mults.map(x=>`<tr><td>${Number(x).toFixed(2)}</td></tr>`).join('')}else if(h.peBands){peRows=h.peBands.map(x=>`<tr><td>${Number(x).toFixed(2)}</td></tr>`).join('')}else{peRows='<tr><td>—</td></tr>'.repeat(5)}let peHeader=h.mults?'倍數':'本益比倍數';return`<div class="holding-card"><div class="holding-title">${h.desc||''}</div><div class="valuation-grid"><div class="vg"><table class="stock-table"><tr><th>股號</th><th>股名</th><th>股價</th></tr><tr><td class="codecell">${h.c}</td><td>${h.n}</td><td>${F(h.p)}</td></tr><tr><th>持有股數</th><th>成本均價</th><th>成本</th></tr><tr><td>${F(h.s)}</td><td class="costcell">${F(h.a)}</td><td>${F(cost)}</td></tr><tr><th colspan="2">未實現損益</th><td class="${pnl>=0?'pnlpos':'pnlneg'}">${pnl>=0?'+':''}${F(pnl)}</td></tr></table></div><div class="vg meaningcell" style="display:flex;align-items:center;justify-content:center;text-align:center">${F(h.p)}<br><span style="font-size:12px;color:#667085">${meaning}</span></div><div class="vg"><div class="refbox"><div class="side-label">60日均價滾動本益比</div><div class="refcontent"><div class="caption">${h.ref&&h.ref.includes('(F)')?'預估年度':'基準日期'}</div><div class="date">${h.ref||'—'}</div><div class="caption">${h.refLabel||'EPS'}</div><div class="eps">${F(h.e)}</div><div class="caption">${h.mults?'未來盈餘成長':'即時本益比'}</div><div class="pe">${F(h.pe)}</div><div class="caption">60日滾動本益比基準</div><div class="pe">${F(h.basePE)}</div></div></div></div><div class="vg"><table class="pe-table"><tr><th>${peHeader}</th></tr>${peRows}</table></div><div class="vg"><table class="band-table"><tr><th>意義</th><th>價格</th></tr>${bands||'<tr><td colspan="2">尚未設定</td></tr>'}</table></div></div><div class="hold-footer"><button class="danger" onclick="delHolding(${i})">刪除／汰弱</button></div></div>`}).join('');let total=hs.reduce((a,h)=>a+(Number(h.p)||0)*(Number(h.s)||0),0),pnl=hs.reduce((a,h)=>a+((Number(h.p)||0)-(Number(h.a)||0))*(Number(h.s)||0),0),low=hs.filter(h=>['特價','便宜價'].includes(priceMeaning(h))).length,fair=hs.filter(h=>priceMeaning(h)==='合理價').length,high=hs.filter(h=>['昂貴價','瘋狂價'].includes(priceMeaning(h))).length;summary.innerHTML=[["總持股市值",F(total)+' 元'],["總未實現損益",(pnl>=0?'+':'')+F(pnl)+' 元'],["便宜／特價",low+' 檔'],["合理價",fair+' 檔'],["昂貴價以上",high+' 檔'],["估值核心","60日滾動本益比"]].map((x,i)=>`<div class="card"><div class="label">${x[0]}</div><div class="num ${i===1?(pnl>=0?'up':'down'):''}" style="font-size:${i===5?'18px':'25px'}">${x[1]}</div></div>`).join('')}document.addEventListener('DOMContentLoaded',()=>{document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addHolding()}})});render();</script></body></html>
