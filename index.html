<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>台股智慧市場儀表板 V2</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#182230;--muted:#667085;--line:#dfe5ec;--up:#df1f26;--down:#16834b;--blue:#2166d1;--yellow:#fff4a8;--lightblue:#dceafa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;position:sticky;top:0;z-index:5}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{font-size:27px;font-weight:900}.sub,.small{font-size:12px;color:var(--muted)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 13px;font-weight:800;cursor:pointer}.btn.secondary{background:#eef3fb;color:#234}
.wrap{max-width:1500px;margin:auto;padding:15px}.sec{font-size:20px;font-weight:900;margin:12px 0 8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.g3{display:grid;grid-template-columns:1fr 2fr 2fr;gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 4px 14px #243b5310}
.label{font-size:12px;color:var(--muted)}.num{font-size:28px;font-weight:900;margin:5px 0}.up{color:var(--up)}.down{color:var(--down)}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.gaugebox{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;align-items:center}.gauge-svg{width:100%;max-width:360px;display:block;margin:auto}
.legend{font-size:12px;line-height:1.9}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.d1{background:#2ca35c}.d2{background:#7dbd45}.d3{background:#52a9df}.d4{background:#f2c94c}.d5{background:#f47721}.d6{background:#df1f26}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.toolbar input{padding:8px 9px;border:1px solid #ccd4de;border-radius:7px;width:120px}
.status{font-size:12px;margin:6px 0}.summary6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.holdings-wrap{display:grid;gap:14px}.holding-card{background:#fff;border:1px solid #cfd7e2;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px #243b5310}
.holding-title{text-align:center;background:#eef1f8;padding:7px 10px;font-weight:800;border-bottom:1px solid #cfd7e2}
.valuation-grid{display:grid;grid-template-columns:1.8fr .72fr 1.05fr 1.15fr 1.05fr;min-height:185px}.vg{border-right:1px solid #cfd7e2}.vg:last-child{border-right:0}
.stock-table,.pe-table,.band-table{width:100%;border-collapse:collapse;font-size:13px}.stock-table td,.stock-table th,.pe-table td,.pe-table th,.band-table td,.band-table th{border:1px solid #cfd7e2;padding:6px 7px;text-align:center}
.stock-table th,.pe-table th,.band-table th{background:#f6f7f9}.codecell{background:var(--yellow);font-weight:800}.meaningcell{background:var(--lightblue);font-weight:900;font-size:19px}.costcell{background:#fff6c5}
.side-label{writing-mode:vertical-rl;letter-spacing:2px;color:#5b3f88;font-weight:900;font-size:15px;background:#faf7ff;display:flex;align-items:center;justify-content:center;padding:8px}
.refbox{height:100%;display:grid;grid-template-columns:.22fr .78fr}.refcontent{padding:7px 9px;text-align:center}.refcontent .date{font-weight:900;color:#c83a2c;font-size:18px}
.refcontent .eps{font-weight:900;color:#d2a100;font-size:18px}.refcontent .pe{font-weight:900;font-size:18px}.refcontent .caption{font-size:12px;color:var(--muted);margin:2px 0}
.band-table td:first-child{font-weight:800}.band-table tr:nth-child(2) td:first-child{background:#cfe7ae}.band-table tr:nth-child(3) td:first-child{background:#dcebc3}.band-table tr:nth-child(4) td:first-child{background:#dceafa}.band-table tr:nth-child(5) td:first-child{background:#f3c8c4}.band-table tr:nth-child(6) td:first-child{background:#e79c9c}
.hold-footer{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;background:#fafbfc;border-top:1px solid #e1e6ec;align-items:center}.danger{background:#fee2e2;color:#991b1b;border:0;border-radius:6px;padding:5px 8px;cursor:pointer}
.advice{background:#fff9e8;border-color:#f0d27b}footer{text-align:center;color:#7b8794;font-size:12px;padding:20px}
@media(max-width:1200px){.g4,.g3,.summary6{grid-template-columns:1fr 1fr}.gaugebox{grid-template-columns:1fr}.valuation-grid{grid-template-columns:1.5fr .55fr 1fr 1fr 1fr}}
@media(max-width:820px){header{position:static}.top{align-items:flex-start;flex-direction:column}.g4,.g3,.summary6{grid-template-columns:1fr}.title{font-size:21px}.wrap{padding:9px}.toolbar input,.toolbar .btn{width:100%}.holding-card{overflow:auto}.valuation-grid,.holding-title,.hold-footer{min-width:900px}}
</style></head>
<body>
<header><div class="top"><div><div class="title">台股智慧市場儀表板 V2</div><div class="sub">大盤＋籌碼＋情緒＋60日均價滾動本益比估值｜紅漲綠跌｜手機／桌機</div></div><div><a href="history.html" class="btn secondary" style="text-decoration:none">歷史紀錄</a></div></div></header>
<main class="wrap">
<div class="sec">① 大盤核心</div><div class="g4" id="core"></div>
<div class="sec">② 籌碼與市場情緒</div><div class="g3" id="sent"></div>
<div class="sec">③ 盤面強弱</div><div class="g3" id="breadth"></div>
<div class="sec">④ 我的持股｜估值模組</div>
<div class="card"><div class="toolbar">
<input id="code" placeholder="股票代碼"><input id="name" placeholder="股票名稱" readonly><input id="price" placeholder="股價" readonly><input id="eps" placeholder="近4季EPS" readonly><input id="pe60" placeholder="60日滾動PE" readonly>
<input id="shares" type="number" placeholder="股數"><input id="avg" type="number" placeholder="成本均價">
<button class="btn" id="lookupBtn" onclick="lookupStock()">查詢股票</button><button class="btn" onclick="addHolding()">＋新增持股</button><button class="btn secondary" onclick="resetHoldings()">恢復四檔</button>
</div><div id="lookupStatus" class="status small">股票資料由 GitHub Actions 每日從證交所官方資料更新；網頁只讀取本站 stocks.json，不再直接跨站查詢。</div></div>
<div class="holdings-wrap" id="holdings"></div>
<div class="sec">⑤ 持股估值總覽</div><div class="summary6" id="summary"></div>
</main>
<footer>自動資料：TWSE 官方 OpenAPI／盤後日資料 → GitHub Actions → stocks.json。估值模型僅供參考，非投資建議。</footer>
<script>
const fallback={updated:"2026/08/14 07:30",core:{idx:46021.48,chg:503.41,pct:1.11,vol:"1.05 兆",volPct:2.35,fut:46389,futChg:364,futPct:.79,basis:3.52},inst:{t:907.56,f:756.95,tr:.01,d:150.60},pc:{oi:1.16,trade:1.05},fg:78,b:{u:800,d:989,lu:38,ld:4},leaders:[["台積電 2330",2345,35,1.52],["聯發科 2454",4225,78,1.88],["鴻海 2317",1845,-12,-.65]],market:"偏多，但非全面普漲",
h:[
{c:"3008",n:"大立光",desc:"全球智慧型手機鏡頭龍頭廠",p:4355,ch:55,pc:1.28,s:45,a:2350,e:188.02,pe:23.16,ref:"2026/8/10",refLabel:"近4季EPS",basePE:25.69,peBands:[35.50,30.83,25.69,20.55,15.88],labels:["昂貴價","合理價(上緣)","合理價(下緣)","便宜價","特價"],v:[6675.4,5796.3,4830.2,3864.2,2985.1],autoModel:true},
{c:"6510",n:"精測",desc:"中華電信旗下晶圓測試介面板廠",p:2800,ch:40,pc:1.45,s:250,a:3121.69,e:42.45,pe:65.96,ref:"2026/8/10",refLabel:"近4季EPS",basePE:91.14,peBands:[125.96,109.37,91.14,72.91,56.32],labels:["昂貴價","合理價(上緣)","合理價(下緣)","便宜價","特價"],v:[5346.8,4642.7,3868.9,3095.1,2391],autoModel:false},
{c:"3044",n:"健鼎",desc:"全球前十大印刷電路板廠之一",p:441.5,ch:-3.5,pc:-.79,s:1000,a:429.2,e:25.15,pe:20.99,ref:"2026(F)",refLabel:"預估EPS",basePE:20.99,mults:[1.5,1.25,1,.75,.5],labels:["瘋狂價","昂貴價","合理價","便宜價","特價"],v:[792,660,528,396,264],autoModel:false},
{c:"2454",n:"聯發科",desc:"全球智慧型手機晶片大廠",p:4020,ch:-20,pc:-.5,s:55,a:3333.82,e:60.67,pe:66.26,ref:"2026/8/10",refLabel:"近4季EPS",basePE:63.4,peBands:[87.62,76.08,63.4,50.72,39.18],labels:["昂貴價","合理價(上緣)","合理價(下緣)","便宜價","特價"],v:[5315.8,4615.8,3846.5,3077.2,2377.1],autoModel:false}
]};
const KEY='tw_v2_holdings_backend_v1';let D=JSON.parse(JSON.stringify(fallback)),lookupCache=null,stockDB={};
const F=n=>(n===null||n===undefined||isNaN(Number(n)))?'—':Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2}),P=n=>(Number(n)>=0?'+':'')+F(n)+'%';
function pcs(v){return v<.7?['極度偏空','down']:v<1?['偏空','down']:v<1.2?['正常範圍','']:v<1.35?['偏多','up']:v<1.45?['偏多注意','up']:['最後的煙火／戒慎貪婪','up']}
function fgs(v){return v<30?['市場恐懼','down']:v<50?['市場溫和','']:v<65?['市場樂觀','up']:v<80?['市場樂觀追價','up']:['市場無腦多／小心最後煙火','up']}
function polar(cx,cy,r,a){let rad=(a-90)*Math.PI/180;return[cx+r*Math.cos(rad),cy+r*Math.sin(rad)]}
function arcPath(cx,cy,r,a0,a1){let s=polar(cx,cy,r,a1),e=polar(cx,cy,r,a0);return`M ${s[0]} ${s[1]} A ${r} ${r} 0 0 0 ${e[0]} ${e[1]}`}
function gaugeSVG(v,min,max,type){let cuts=type==='pc'?[.5,.7,1,1.2,1.35,1.45,2]:[0,30,50,65,80,100],cols=type==='pc'?['#2ca35c','#7dbd45','#52a9df','#f2c94c','#f47721','#df1f26']:['#2ca35c','#7dbd45','#f2c94c','#f47721','#df1f26'],paths='';for(let i=0;i<cuts.length-1;i++){let a0=-90+(cuts[i]-min)/(max-min)*180,a1=-90+(cuts[i+1]-min)/(max-min)*180;paths+=`<path d="${arcPath(180,150,105,a0,a1)}" stroke="${cols[i]}" stroke-width="26" fill="none"/>`}let vv=Math.max(min,Math.min(max,v)),ang=-90+(vv-min)/(max-min)*180,pt=polar(180,150,78,ang),st=type==='pc'?pcs(v):fgs(v),value=type==='pc'?F(v):F(v)+'/100';return`<svg class="gauge-svg" viewBox="0 0 360 220">${paths}<line x1="180" y1="150" x2="${pt[0]}" y2="${pt[1]}" stroke="#111" stroke-width="5"/><circle cx="180" cy="150" r="7"/><text x="180" y="182" text-anchor="middle" font-size="30" font-weight="900">${value}</text><text x="180" y="207" text-anchor="middle" font-size="16" font-weight="800">${st[0]}</text></svg>`}
async function loadStockDB(){try{let r=await fetch('stocks.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);let j=await r.json();stockDB=j.stocks||{};lookupStatus.textContent=`股票資料庫：${j.count||0} 檔｜更新 ${j.updated||'尚未完成第一次更新'}`;refreshHoldingsFromDB()}catch(e){lookupStatus.textContent='股票資料庫尚未就緒，請稍後再試。';}}
function lookupStock(){let c=code.value.trim();if(!/^\d{4,6}$/.test(c)){lookupStatus.textContent='請輸入正確股票代碼';return}let x=stockDB[c];if(!x){lookupCache=null;lookupStatus.textContent=`資料庫目前找不到 ${c}。若剛建立後端，請等 GitHub Actions 第一次更新完成。`;return}
let labels=x.labels||["昂貴價","合理價(上緣)","合理價(下緣)","便宜價","特價"],vals=x.values||[],bands=x.peBands||[];
lookupCache={c,n:x.name,desc:"上市公司｜自動資料",p:x.price,ch:0,pc:0,s:+shares.value||0,a:+avg.value||0,e:x.eps,pe:x.pe,ref:new Date().toLocaleDateString('zh-TW'),refLabel:"近4季EPS",basePE:x.basePE,peBands:bands,labels,v:vals,autoModel:true,historyDays:x.historyDays||0};
name.value=x.name||'';price.value=F(x.price);eps.value=F(x.eps);pe60.value=F(x.basePE);
lookupStatus.textContent=`完成：${c} ${x.name}｜股價 ${F(x.price)}｜EPS ${F(x.eps)}｜60日均價 ${F(x.avg60)}｜60日滾動PE ${F(x.basePE)}｜樣本 ${x.historyDays||0} 日`;
}
function getHoldings(){try{let x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)?x:D.h}catch(e){return D.h}}
function saveHoldings(h){localStorage.setItem(KEY,JSON.stringify(h))}
function addHolding(){if(!lookupCache){lookupStatus.textContent='請先查詢股票';return}let h=getHoldings();if(h.some(x=>x.c===lookupCache.c)){lookupStatus.textContent='這檔股票已在持股清單';return}lookupCache.s=+shares.value||0;lookupCache.a=+avg.value||0;h.push(lookupCache);saveHoldings(h);renderHoldings(h);lookupStatus.textContent='已新增 '+lookupCache.c+' '+lookupCache.n;code.value=name.value=price.value=eps.value=pe60.value=shares.value=avg.value='';lookupCache=null}
function delHolding(i){let h=getHoldings();if(confirm('確定刪除 '+h[i].c+' '+h[i].n+'？')){h.splice(i,1);saveHoldings(h);renderHoldings(h)}}
function resetHoldings(){saveHoldings(JSON.parse(JSON.stringify(fallback.h)));renderHoldings(getHoldings());refreshHoldingsFromDB()}
function refreshHoldingsFromDB(){if(!Object.keys(stockDB).length)return;let h=getHoldings(),changed=false;h=h.map(x=>{let q=stockDB[x.c];if(!q)return x;let y={...x,p:q.price??x.p,pe:q.pe??x.pe};if(x.autoModel!==false&&q.basePE){y.n=q.name||x.n;y.e=q.eps;y.basePE=q.basePE;y.peBands=q.peBands;y.labels=q.labels;y.v=q.values;y.ref=new Date().toLocaleDateString('zh-TW');y.refLabel='近4季EPS';y.historyDays=q.historyDays;changed=true}else if(q.price!==x.p){changed=true}return y});if(changed)saveHoldings(h);renderHoldings(h)}
function priceMeaning(h){if(!h.v||h.v.length<5)return'尚未設定';let a=[...h.v].sort((x,y)=>x-y);if(h.p<=a[0])return'特價';if(h.p<=a[1])return'便宜價';if(h.p<=a[3])return'合理價';return'昂貴價'}
function render(){let c=D.core;core.innerHTML=[["加權指數",F(c.idx),`▲ ${F(c.chg)}　${P(c.pct)}`],["成交值",c.vol,`較昨日 ${P(c.volPct)}`],["台指期夜盤",F(c.fut),`▲ ${F(c.futChg)}　${P(c.futPct)}`],["台指期正逆價差",(c.basis>=0?'+':'')+F(c.basis),c.basis>=0?'正價差':'逆價差']].map((x,i)=>`<div class="card"><div class="label">${x[0]}</div><div class="num ${i===1?'':'up'}">${x[1]}</div><div>${x[2]}</div></div>`).join('');
let fs=fgs(D.fg);sent.innerHTML=`<div class="card"><div class="label">三大法人</div><div class="num up">+${F(D.inst.t)} 億</div><div class="row"><span>外資</span><b class="up">+${F(D.inst.f)} 億</b></div></div><div class="card"><div class="label">P/C Ratio</div><div class="gaugebox">${gaugeSVG(D.pc.oi,.5,2,'pc')}<div class="legend">成交比 ${F(D.pc.trade)}<br>未平倉比 ${F(D.pc.oi)}</div></div></div><div class="card"><div class="label">台股 Fear & Greed</div><div class="gaugebox">${gaugeSVG(D.fg,0,100,'fg')}<div class="legend">${fs[0]}</div></div></div>`;
breadth.innerHTML=`<div class="card"><div class="label">上漲／下跌家數</div><div class="num"><span class="up">${F(D.b.u)}</span> / <span class="down">${F(D.b.d)}</span></div></div><div class="card"><div class="label">權值股觀察</div>${D.leaders.map(r=>`<div class="row"><span>${r[0]}</span><span>${F(r[1])}</span></div>`).join('')}</div><div class="card"><div class="label">市場結構</div><div class="num up">${D.market}</div></div>`;
renderHoldings(getHoldings())}
function renderHoldings(hs){holdings.innerHTML=hs.map((h,i)=>{let cost=h.s*h.a,pnl=(h.p-h.a)*h.s,meaning=priceMeaning(h),bands=(h.labels||[]).map((lab,j)=>`<tr><td>${lab}</td><td>${h.v&&h.v[j]!=null?F(h.v[j]):'—'}</td></tr>`).join(''),peRows=(h.mults||h.peBands||[null,null,null,null,null]).map(x=>`<tr><td>${x==null?'—':F(x)}</td></tr>`).join('');
return`<div class="holding-card"><div class="holding-title">${h.desc||''}</div><div class="valuation-grid"><div class="vg"><table class="stock-table"><tr><th>股號</th><th>股名</th><th>股價</th></tr><tr><td class="codecell">${h.c}</td><td>${h.n}</td><td>${F(h.p)}</td></tr><tr><th>持有股數</th><th>成本均價</th><th>成本</th></tr><tr><td>${F(h.s)}</td><td class="costcell">${F(h.a)}</td><td>${F(cost)}</td></tr><tr><th colspan="2">未實現損益</th><td class="${pnl>=0?'up':'down'}">${pnl>=0?'+':''}${F(pnl)}</td></tr></table></div><div class="vg meaningcell" style="display:flex;align-items:center;justify-content:center;text-align:center">${F(h.p)}<br><span style="font-size:12px">${meaning}</span></div><div class="vg"><div class="refbox"><div class="side-label">60日均價滾動本益比</div><div class="refcontent"><div class="caption">基準日期</div><div class="date">${h.ref||'—'}</div><div class="caption">${h.refLabel||'EPS'}</div><div class="eps">${F(h.e)}</div><div class="caption">即時本益比</div><div class="pe">${F(h.pe)}</div><div class="caption">60日滾動本益比</div><div class="pe">${F(h.basePE)}</div></div></div></div><div class="vg"><table class="pe-table"><tr><th>${h.mults?'倍數':'本益比倍數'}</th></tr>${peRows}</table></div><div class="vg"><table class="band-table"><tr><th>意義</th><th>價格</th></tr>${bands}</table></div></div><div class="hold-footer"><span class="small">${h.autoModel===false?'估值模型：自訂／預估 EPS':'估值模型：每日自動更新'}${h.historyDays?'｜歷史 '+h.historyDays+' 日':''}</span><button class="danger" onclick="delHolding(${i})">刪除／汰弱</button></div></div>`}).join('');
let total=hs.reduce((a,h)=>a+h.p*h.s,0),pnl=hs.reduce((a,h)=>a+(h.p-h.a)*h.s,0);summary.innerHTML=[["總持股市值",F(total)+' 元'],["總未實現損益",(pnl>=0?'+':'')+F(pnl)+' 元'],["持股檔數",hs.length+' 檔'],["估值核心","60日滾動本益比"]].map((x,i)=>`<div class="card"><div class="label">${x[0]}</div><div class="num" style="font-size:${i===3?'18px':'25px'}">${x[1]}</div></div>`).join('')}
code.addEventListener('keydown',e=>{if(e.key==='Enter')lookupStock()});
render();loadStockDB();
</script></body></html>
