<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7fb">
<title>週三／週五選擇權結算紀錄</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#182230;--muted:#667085;--line:#dfe5ec;--up:#df1f26;--down:#16834b;--blue:#2166d1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:15px 20px}.top{max-width:1250px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:23px;font-weight:900}.small{font-size:12px;color:var(--muted)}.wrap{max-width:1250px;margin:auto;padding:15px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 4px 14px #243b5310}.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 13px;font-weight:800;cursor:pointer;text-decoration:none}.btn.secondary{background:#eef3fb;color:#234}.danger{background:#fee2e2;color:#991b1b;border:0;border-radius:6px;padding:5px 8px;cursor:pointer}.badge{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:900}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:11px}.stat span,label{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:24px;margin-top:4px}.up{color:var(--up)}.down{color:var(--down)}.form{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.field label{display:block;margin-bottom:4px}.field input,.field select{width:100%;border:1px solid #ccd4de;border-radius:7px;padding:8px;background:#fff}.wide{grid-column:span 2}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1050px}.table th,.table td{border-bottom:1px solid var(--line);padding:8px;text-align:center;font-size:12px}.table th{background:#f6f7f9;color:var(--muted)}.settings{background:#f8fafc;border-radius:9px;padding:10px;margin-top:12px}.settings-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:650px}.empty{text-align:center;color:var(--muted);padding:20px}.note{font-size:12px;color:var(--muted);line-height:1.65}
@media(max-width:820px){.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}.settings-grid{grid-template-columns:1fr}.title{font-size:20px}}
</style></head><body>
<header><div class="top"><div><div class="title">週三／週五｜台指選擇權結算短沖</div><div class="small">09:00～09:20 Call／Put 獨立紀錄頁</div></div><a class="btn secondary" href="index.html">← 回台股儀表板</a></div></header>
<main class="wrap"><section class="card">
<div class="head"><div><b>交易紀錄與勝率</b><div class="note" id="dayNote"></div></div><span class="badge" id="dayBadge"></span></div>
<div class="stats"><div class="stat"><span>已平倉筆數</span><b id="trades">0</b></div><div class="stat"><span>勝率</span><b id="winRate">—</b></div><div class="stat"><span>累計淨損益</span><b id="pnl">0</b></div><div class="stat"><span>平均每筆</span><b id="avg">0</b></div></div>
<div id="entryArea"><div class="form">
<div class="field"><label>日期</label><input id="date" type="date"></div><div class="field"><label>商品</label><select id="type"><option>CALL</option><option>PUT</option></select></div><div class="field"><label>履約價</label><input id="strike" type="number" step="50" placeholder="44600"></div><div class="field"><label>口數</label><input id="contracts" type="number" min="1" value="1"></div><div class="field"><label>進場時間</label><input id="entryTime" type="time" value="09:05"></div><div class="field"><label>出場時間</label><input id="exitTime" type="time" value="09:20"></div>
<div class="field"><label>進場權利金</label><input id="entryPremium" type="number" min="0" step=".1"></div><div class="field"><label>出場權利金</label><input id="exitPremium" type="number" min="0" step=".1"></div><div class="field"><label>交易成本（元）</label><input id="costs" type="number" min="0" value="0"></div><div class="field"><label>09:00台指期</label><input id="future" type="number"></div><div class="field"><label>09:00現貨</label><input id="spot" type="number"></div><div class="field wide"><label>進場理由／觀察</label><input id="note" placeholder="突破早盤高點、站上VWAP、台積電同步"></div>
</div><div class="actions"><button class="btn" id="save">儲存紀錄</button><button class="btn secondary" id="cancel" style="display:none">取消修改</button></div></div>
<div class="table-wrap"><table class="table"><thead><tr><th>日期</th><th>商品</th><th>履約價</th><th>進／出場</th><th>權利金</th><th>口數</th><th>期現價差</th><th>淨損益</th><th>勝負</th><th>備註</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
<details class="settings"><summary><b>策略設定（勝率、停損停利在這裡修改）</b></summary><div class="settings-grid"><div class="field"><label>勝利門檻（淨利元）</label><input id="winThreshold" type="number"></div><div class="field"><label>停損提醒（%）</label><input id="stopLoss" type="number" min="1"></div><div class="field"><label>停利提醒（%）</label><input id="takeProfit" type="number" min="1"></div></div><div class="actions"><button class="btn secondary" id="saveSettings">儲存策略設定</button></div><div class="note">勝率＝淨損益高於勝利門檻的筆數 ÷ 已平倉筆數。淨損益＝（出場權利金－進場權利金）×50元×口數－交易成本。資料只存在目前裝置的瀏覽器。</div></details>
</section></main>
<script>
const RK='txo_settlement_journal_v1',SK='txo_settlement_settings_v1',defaults={winThreshold:0,stopLoss:15,takeProfit:25};let records=read(RK,[]),settings={...defaults,...read(SK,{})},editing=null;
const $=id=>document.getElementById(id),n=v=>Number(v)||0,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function isDay(d){const x=new Date(d+'T12:00:00+08:00').getDay();return x===3||x===5}function wd(d){return new Intl.DateTimeFormat('zh-TW',{weekday:'short',timeZone:'Asia/Taipei'}).format(new Date(d+'T12:00:00+08:00'))}
function calc(r){return Math.round((n(r.exitPremium)-n(r.entryPremium))*50*Math.max(1,n(r.contracts))-n(r.costs))}
function reset(){editing=null;$('date').value=today();$('type').value='CALL';$('strike').value='';$('contracts').value=1;$('entryTime').value='09:05';$('exitTime').value='09:20';$('entryPremium').value='';$('exitPremium').value='';$('costs').value=0;$('future').value='';$('spot').value='';$('note').value='';$('save').textContent='儲存紀錄';$('cancel').style.display='none'}
function form(){return{id:editing||'t'+Date.now(),date:$('date').value,type:$('type').value,strike:n($('strike').value),contracts:Math.max(1,n($('contracts').value)),entryTime:$('entryTime').value,exitTime:$('exitTime').value,entryPremium:n($('entryPremium').value),exitPremium:n($('exitPremium').value),costs:n($('costs').value),future:n($('future').value),spot:n($('spot').value),note:$('note').value.trim()}}
function save(){const r=form();if(!r.date||!r.strike||!r.entryPremium){alert('請至少填寫日期、履約價與進場權利金。');return}if(!isDay(r.date)&&!confirm('這個日期不是週三或週五，仍要儲存嗎？'))return;const i=records.findIndex(x=>x.id===r.id);if(i>=0)records[i]=r;else records.unshift(r);records.sort((a,b)=>(b.date+b.entryTime).localeCompare(a.date+a.entryTime));write(RK,records);reset();render()}
function edit(id){const r=records.find(x=>x.id===id);if(!r)return;editing=id;['date','type','strike','contracts','entryTime','exitTime','entryPremium','exitPremium','costs','future','spot','note'].forEach(k=>$(k).value=r[k]??'');$('save').textContent='儲存修改';$('cancel').style.display='inline-block';$('entryArea').scrollIntoView({behavior:'smooth'})}
function del(id){if(confirm('確定刪除這筆交易紀錄？')){records=records.filter(x=>x.id!==id);write(RK,records);render()}}
function render(){const active=isDay(today());$('dayBadge').textContent=active?'今天是結算觀察日':'非週三／週五';$('dayNote').textContent=active?'今天可新增09:00～09:20交易紀錄。':'歷史紀錄仍可查看與修改；新增區只在週三、週五顯示。';$('entryArea').style.display=active||editing?'block':'none';const closed=records.filter(r=>n(r.exitPremium)>0),wins=closed.filter(r=>calc(r)>n(settings.winThreshold)),total=closed.reduce((a,r)=>a+calc(r),0),av=closed.length?Math.round(total/closed.length):0;$('trades').textContent=closed.length;$('winRate').textContent=closed.length?(wins.length/closed.length*100).toFixed(1)+'%':'—';$('pnl').textContent=(total>0?'+':'')+total.toLocaleString()+' 元';$('pnl').className=total>0?'up':total<0?'down':'';$('avg').textContent=(av>0?'+':'')+av.toLocaleString()+' 元';$('avg').className=av>0?'up':av<0?'down':'';
$('rows').innerHTML=records.length?records.map(r=>{const p=n(r.exitPremium)>0?calc(r):null,b=n(r.future)&&n(r.spot)?n(r.future)-n(r.spot):null,result=p===null?'未平倉':p>n(settings.winThreshold)?'勝':'負';return `<tr><td>${esc(r.date)}<br>${wd(r.date)}</td><td><b>${esc(r.type)}</b></td><td>${n(r.strike).toLocaleString()}</td><td>${esc(r.entryTime)}／${esc(r.exitTime||'—')}</td><td>${n(r.entryPremium)} → ${n(r.exitPremium)||'—'}</td><td>${n(r.contracts)}</td><td>${b===null?'—':(b>0?'+':'')+b.toLocaleString()}</td><td class="${p>0?'up':p<0?'down':''}">${p===null?'—':(p>0?'+':'')+p.toLocaleString()+' 元'}</td><td><b>${result}</b></td><td>${esc((r.note||'—').slice(0,24))}</td><td><button class="btn secondary" data-e="${r.id}" style="padding:5px 7px">修改</button> <button class="danger" data-d="${r.id}">刪除</button></td></tr>`}).join(''):'<tr><td colspan="11" class="empty">尚無紀錄</td></tr>';$('rows').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>edit(b.dataset.e));$('rows').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>del(b.dataset.d));$('winThreshold').value=settings.winThreshold;$('stopLoss').value=settings.stopLoss;$('takeProfit').value=settings.takeProfit}
$('save').onclick=save;$('cancel').onclick=()=>{reset();render()};$('saveSettings').onclick=()=>{settings={winThreshold:n($('winThreshold').value),stopLoss:n($('stopLoss').value)||15,takeProfit:n($('takeProfit').value)||25};write(SK,settings);render();alert('策略設定已儲存，勝率已重新計算。')};reset();render();
</script></body></html>
