name: V5 LINE valuation alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '5 7 * * 1-5' # 15:05 Asia/Taipei, after stock quote update

permissions:
  contents: write

concurrency:
  group: v5-line-valuation-alerts
  cancel-in-progress: false

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check valuation zones and send LINE alerts
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
        run: python scripts/check_line_valuation_alerts.py

      - name: Persist alert state
        run: |
          if git diff --quiet -- line_alert_state.json; then
            echo 'No alert state changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add line_alert_state.json
          git commit -m 'data(v5): update LINE valuation alert state'
          git pull --rebase origin main
          git push origin HEAD:main
