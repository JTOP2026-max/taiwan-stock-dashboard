name: Update market core

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/update_market.py'
      - '.github/workflows/update-market.yml'
  schedule:
    - cron: '45 6 * * 1-5'   # 14:45 Taiwan, day-session market data
    - cron: '30 10 * * 1-5'  # 18:30 Taiwan, refresh daily sentiment fields
    - cron: '15 22 * * 0-4'  # 06:15 Taiwan Mon-Fri, night-session fields

permissions:
  contents: write

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install requests
      - name: Update Taiwan market core data
        run: python scripts/update_market.py
      - name: Commit market core only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add market.json market_history.json cnn_fear_greed.json
          if git diff --cached --quiet; then
            echo "No market data changes"
          else
            git commit -m "chore: update market core"
            git pull --rebase origin main
            git push
          fi
