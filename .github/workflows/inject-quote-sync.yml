name: Inject holding quote sync

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'quote-sync.js'
      - '.github/workflows/inject-quote-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load quote sync on dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove older quote-sync tags so cache version is deterministic.
          import re
          s=re.sub(r'\s*<script src="quote-sync\.js[^\"]*"></script>', '', s)
          tag='\n<script src="quote-sync.js?v=20260821g"></script>\n'
          s=s.replace('</body>', tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "quote sync already loaded"
          else
            git commit -m "fix: load automatic holding quote sync"
            git pull --rebase origin main
            git push
          fi
