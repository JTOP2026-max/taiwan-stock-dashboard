name: V5 - Corporate actions and company events

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * 1-5'  # 08:20 Asia/Taipei
    - cron: '20 6 * * 1-5'  # 14:20 Asia/Taipei

concurrency:
  group: v5-corporate-events
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install requests
      - name: Update official corporate actions and company events
        run: python scripts/update_corporate_actions.py
      - name: Merge verified supplemental events
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          path='company_events.json'
          with open(path, encoding='utf-8') as f:
              base=json.load(f)
          try:
              with open('manual_company_events.json', encoding='utf-8') as f:
                  extra=json.load(f).get('events', [])
          except Exception:
              extra=[]
          events=base.get('events', [])
          seen={e.get('id') for e in events}
          for event in extra:
              if event.get('id') not in seen:
                  events.append(event)
                  seen.add(event.get('id'))
          events.sort(key=lambda x:(x.get('date') or '9999-12-31', x.get('code',''), x.get('kind','')))
          base['events']=events
          base['count']=len(events)
          base['updated']=datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M')
          with open(path,'w',encoding='utf-8') as f:
              json.dump(base,f,ensure_ascii=False,indent=2)
          PY
      - name: Commit event files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- corporate_actions.json company_events.json
          if git diff --cached --quiet; then
            echo "No corporate event changes"
            exit 0
          fi
          git commit -m "data(v5): update corporate events"
          git pull --rebase origin main
          git push origin HEAD:main
