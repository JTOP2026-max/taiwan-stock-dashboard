name: Update corporate actions and company events

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_corporate_actions.py'
      - '.github/workflows/update-corporate-actions.yml'
  schedule:
    - cron: '20 0 * * 1-5'   # 08:20 Taiwan time
    - cron: '20 6 * * 1-5'   # 14:20 Taiwan time

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/update_corporate_actions.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corporate_actions.json company_events.json
          git diff --cached --quiet || git commit -m "Update corporate actions and company events"
          git push
