name: Apply portfolio rules v2

on:
  push:
    paths:
      - 'scripts/apply_portfolio_rules_v2.py'
      - '.github/workflows/apply-portfolio-rules-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_portfolio_rules_v2.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Apply portfolio colors and PnL rules'
          git push
