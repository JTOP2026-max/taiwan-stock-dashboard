name: Patch holdings editable UI v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-ui-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply UI patch
        run: python scripts/patch_ui_v4.py
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/update_stocks.py
          git diff --cached --quiet || git commit -m 'Make holding values editable and add crazy-price band'
          git push
