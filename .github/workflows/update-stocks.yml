name: V5 - Stock quotes

on:
  workflow_dispatch:
  schedule:
    - cron: '45 6 * * 1-5'  # 14:45 Asia/Taipei

concurrency:
  group: v5-stock-quotes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install requests
      - name: Update TWSE and TPEx stock quotes
        run: python scripts/update_stocks.py
      - name: Commit quote data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- stocks.json stock_history.json
          if git diff --cached --quiet; then
            echo "No quote changes"
            exit 0
          fi
          git commit -m "data(v5): update stock quotes"
          git pull --rebase origin main
          git push origin HEAD:main
