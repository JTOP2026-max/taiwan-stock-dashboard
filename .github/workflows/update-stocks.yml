name: Update stock quotes

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/update_stocks.py'
      - '.github/workflows/update-stocks.yml'
  schedule:
    - cron: '45 6 * * 1-5'  # 14:45 Taiwan

permissions:
  contents: write

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install requests
      - name: Update TWSE and TPEx stock quotes
        run: python scripts/update_stocks.py
      - name: Commit quote data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks.json stock_history.json
          if git diff --cached --quiet; then
            echo "No quote changes"
          else
            git commit -m "chore: update stock quotes"
            git pull --rebase origin main
            git push
          fi
