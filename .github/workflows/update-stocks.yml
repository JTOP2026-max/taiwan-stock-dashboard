name: Update stock data

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/update_stocks.py'
      - 'scripts/backfill_tracked_history.py'
      - '.github/workflows/update-stocks.yml'
  schedule:
    - cron: '45 6 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install requests
      - name: Update TWSE and TPEx stock data
        run: python scripts/update_stocks.py
      - name: Backfill tracked stock history
        run: python scripts/backfill_tracked_history.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks.json stock_history.json stock_ohlcv.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update stock data"
            git pull --rebase origin main
            git push
          fi
