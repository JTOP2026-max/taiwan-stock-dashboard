name: V5 one-time initialize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v5-initialize.yml'

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Initialize official stock data
        run: python scripts/update_stocks.py
      - name: Commit initialized data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- stocks.json stock_history.json
          if git diff --cached --quiet; then
            echo "No initialization changes"
            exit 0
          fi
          git commit -m "data(v5): initialize official stock data"
          git pull --rebase origin main
          git push origin HEAD:main
