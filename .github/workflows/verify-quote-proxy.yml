name: Verify Quote Proxy

on:
  push:
    paths:
      - '.github/workflows/verify-quote-proxy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            https://taiwan-stock-quote-proxy.safecar7249.workers.dev/health \
            | tee health.json
          python - <<'PY'
          import json
          j=json.load(open('health.json'))
          assert j.get('ok') is True, j
          assert j.get('service') == 'taiwan-stock-quote-proxy', j
          print('health_ok', j)
          PY

      - name: Diagnose upstream and proxy
        run: |
          set -u
          echo '--- direct MIS ---'
          curl -sS -D direct.headers \
            -H 'User-Agent: Mozilla/5.0' \
            -H 'Referer: https://mis.twse.com.tw/' \
            'https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_3008.tw&json=1&delay=0' \
            -o direct.json || true
          head -40 direct.headers || true
          head -c 1500 direct.json || true
          echo
          echo '--- worker quote ---'
          curl -sS -D proxy.headers \
            'https://taiwan-stock-quote-proxy.safecar7249.workers.dev/quote?code=3008' \
            -o proxy.json || true
          head -40 proxy.headers || true
          cat proxy.json || true
