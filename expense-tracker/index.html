<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b82f6">
<title>大學生生活費記帳</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="生活費記帳">
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--blue:#3b82f6;--red:#dc2626;--green:#16a34a;--amber:#d97706}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:980px;margin:auto;padding:18px 14px 40px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}h1{font-size:24px;margin:0}.sub,.hint,.tiny{color:var(--muted)}.sub{font-size:14px;margin-top:4px}.month{font-weight:700;color:#2563eb}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(15,23,42,.06)}.metric{padding:14px}.label{font-size:13px;color:var(--muted)}.value{font-size:20px;font-weight:800;margin-top:7px}.tiny{font-size:12px;margin-top:5px}.negative{color:var(--red)!important}.card{padding:16px;margin-top:14px}.card h2{font-size:17px;margin:0 0 4px}.hint{font-size:13px;margin-bottom:14px}
.formgrid,.budgetgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.control{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;font-size:16px}.btn{border:0;border-radius:13px;padding:12px 16px;font-size:16px;font-weight:800;cursor:pointer}.primary{width:100%;margin-top:12px;background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.danger{color:var(--red);background:#fff;border:1px solid #fecaca}.custom{display:none;margin-top:8px}.custom.show{display:block}
.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px}.progress>div{height:100%;background:var(--blue)}.progress.over>div{background:var(--red)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mini{border:1px solid var(--line);border-radius:14px;padding:12px}.mini b{display:block;margin-top:5px}
.record{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}.rleft{min-width:0}.rnote{font-size:13px;color:var(--muted);margin-top:3px}.ramount{font-weight:800;white-space:nowrap}.del{border:0;background:none;text-decoration:underline;color:var(--muted);cursor:pointer}.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:14px}.callout{background:#eff6ff;border:1px solid #bfdbfe;border-radius:16px;padding:14px;margin-top:14px}.callout.over{background:#fff7ed;border-color:#fed7aa}.install{display:none;background:#ecfdf5;border:1px solid #bbf7d0;border-radius:16px;padding:14px;margin-bottom:14px}.install.show{display:block}.installrow{display:flex;justify-content:space-between;align-items:center;gap:12px}.status-ok{color:var(--green)}.status-warn{color:var(--amber)}.status-bad{color:var(--red)}
.detailTabs{display:flex;gap:8px;margin-bottom:12px}.tabbtn{flex:1;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:10px 12px;font-weight:800;cursor:pointer}.tabbtn.active{background:var(--blue);color:#fff;border-color:var(--blue)}.detailSummary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.detailBox{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.detailBox .dv{font-size:18px;font-weight:800;margin-top:4px}.dateGroup{margin-top:14px}.dateHead{display:flex;justify-content:space-between;align-items:center;font-weight:800;padding:0 2px 5px}.dateTotal{font-size:13px;color:var(--muted)}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid,.budgetgrid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;flex-direction:column}.value{font-size:18px}.wrap{padding:12px 10px 30px}.detailSummary{grid-template-columns:1fr 1fr}.detailSummary .detailBox:last-child{grid-column:1/-1}}
</style>
</head>
<body><main class="wrap">
<header><div><h1>💰 大學生生活費記帳</h1><div class="sub">每天 3 秒記一筆・每週與每月一起掌握</div></div><div class="month" id="period"></div></header>
<div class="install" id="installBox"><div class="installrow"><div><b>📱 可以安裝到手機桌面囉！</b><div class="tiny" id="installHint">像 App 一樣直接開啟，也支援離線使用。</div></div><button class="btn secondary" id="installBtn">安裝 App</button></div></div>
<section class="grid"><div class="metric"><div class="label">本週可用</div><div class="value" id="wb"></div><div class="tiny" id="weekRange"></div></div><div class="metric"><div class="label">本週已花</div><div class="value" id="ws"></div><div class="tiny" id="wp"></div></div><div class="metric"><div class="label">本週剩餘</div><div class="value" id="wr"></div><div class="tiny" id="wstatus"></div></div><div class="metric"><div class="label">本週每日餘額</div><div class="value" id="wd"></div><div class="tiny">負數代表本週赤字</div></div></section>
<section class="grid" style="margin-top:10px"><div class="metric"><div class="label">本月預算</div><div class="value" id="mb"></div><div class="tiny">整月總控管</div></div><div class="metric"><div class="label">本月已花</div><div class="value" id="ms"></div><div class="tiny" id="mp"></div></div><div class="metric"><div class="label">本月剩餘</div><div class="value" id="mr"></div><div class="tiny" id="mstatus"></div></div><div class="metric"><div class="label">本月每日餘額</div><div class="value" id="md"></div><div class="tiny">負數代表本月赤字</div></div></section>
<section class="card"><h2>快速記一筆</h2><div class="hint">輸入金額、選分類與常用備註，也可以自行輸入。</div><div class="formgrid"><div class="field"><label>金額</label><input id="amount" class="control" type="number" min="1" inputmode="numeric" placeholder="例如 85"></div><div class="field"><label>分類</label><select id="category" class="control"></select></div><div class="field"><label>備註</label><select id="notePreset" class="control"></select><input id="noteCustom" class="control custom" placeholder="自行輸入備註"></div></div><button class="btn primary" id="addBtn">＋ 記一筆</button><div class="tiny" id="msg"></div></section>
<section class="card"><h2>生活費設定</h2><div class="hint">每週領多少、整月希望控制多少，可以分開設定。</div><div class="budgetgrid"><div class="field"><label>每週可用金額</label><input id="weeklyBudget" class="control" type="number" min="0"></div><div class="field"><label>每月預算上限</label><input id="monthlyBudget" class="control" type="number" min="0"></div><button class="btn secondary" id="saveBudget">更新預算</button></div><div class="tiny">本週使用進度</div><div class="progress" id="wprog"><div id="wbar"></div></div><div class="tiny">本月使用進度</div><div class="progress" id="mprog"><div id="mbar"></div></div></section>
<section class="card"><h2>本月分類統計</h2><div class="summary" id="summary"></div></section>
<section class="card"><h2>消費明細</h2><div class="hint">可以切換查看「當週」或「當月」每一筆支出。</div><div class="detailTabs"><button class="tabbtn active" id="weekTab">當週消費明細</button><button class="tabbtn" id="monthTab">當月消費明細</button></div><div class="detailSummary" id="detailSummary"></div><div id="detailRecords"></div></section>
<section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><h2>最近紀錄</h2><div class="hint" style="margin:3px 0">資料保存在這台裝置。</div></div><button class="btn danger" id="clearBtn">清除全部</button></div><div id="records"></div></section>
<section class="callout" id="adviceBox"><b>生活費小提醒</b><div id="advice" style="margin-top:6px;font-size:14px"></div></section>
</main>
<script>
const NOTES={'餐飲':['7-11','全家','萊爾富','星巴克','早餐','午餐','晚餐','飲料','自行輸入'],'交通':['公車','捷運','台鐵','高鐵','YouBike','計程車','加油','停車','自行輸入'],'生活用品':['全聯','家樂福','寶雅','藥妝','日用品','洗衣','自行輸入'],'學習':['課本','文具','影印','線上課程','考試報名','社團活動','自行輸入'],'娛樂':['電影','聚餐','唱歌','遊戲','展覽','旅遊','購物','自行輸入'],'住宿':['宿舍費','水電','網路','洗衣','寢具','修繕','自行輸入'],'其他':['醫療','禮物','手續費','臨時支出','自行輸入']};
const ICON={'餐飲':'🍱','交通':'🚌','生活用品':'🧴','學習':'📚','娛樂':'🎬','住宿':'🏠','其他':'🧾'},KEY='collegeExpenseTrackerV1';
let detailMode='week';
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s)return{monthlyBudget:Number(s.monthlyBudget??s.budget)||12000,weeklyBudget:Number(s.weeklyBudget)||3000,records:Array.isArray(s.records)?s.records:[]}}catch(e){}return{monthlyBudget:12000,weeklyBudget:3000,records:[]}}
let state=load();
const money=n=>(n<0?'-':'')+'NT$ '+Math.abs(Math.round(n)).toLocaleString('zh-TW');
const date=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const month=d=>date(d).slice(0,7);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function bounds(d=new Date()){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()),day=x.getDay()||7,s=new Date(x);s.setDate(x.getDate()-day+1);const e=new Date(s);e.setDate(s.getDate()+6);return[s,e]}
function rdate(r){return r.date||String(r.time||'').slice(0,10)}
function setup(){category.innerHTML=Object.keys(NOTES).map(x=>`<option value="${x}">${ICON[x]} ${x}</option>`).join('');notes()}
function notes(){notePreset.innerHTML=NOTES[category.value].map(x=>`<option>${x}</option>`).join('');custom()}
function custom(){noteCustom.classList.toggle('show',notePreset.value==='自行輸入')}
function add(){const a=Number(amount.value);if(!a||a<=0){msg.textContent='請先輸入正確金額。';msg.style.color='var(--red)';return}const now=new Date(),n=notePreset.value==='自行輸入'?(noteCustom.value.trim()||'其他'):notePreset.value;state.records.push({id:Date.now()+Math.random(),amount:a,category:category.value,note:n,date:date(now),month:month(now),time:now.toISOString()});save();amount.value='';noteCustom.value='';msg.textContent=`已記下 ${money(a)}｜${category.value}・${n}`;msg.style.color='var(--green)';render()}
function deleteRecord(id){state.records=state.records.filter(r=>String(r.id)!==String(id));save();render()}
function renderDetail(wr,mr,bs,be){const list=detailMode==='week'?wr:mr,total=list.reduce((a,r)=>a+r.amount,0),days=new Set(list.map(r=>rdate(r))).size,avg=days?total/days:0;detailSummary.innerHTML=`<div class="detailBox"><div class="label">${detailMode==='week'?'本週':'本月'}總支出</div><div class="dv">${money(total)}</div></div><div class="detailBox"><div class="label">記帳筆數</div><div class="dv">${list.length} 筆</div></div><div class="detailBox"><div class="label">有消費日平均</div><div class="dv">${money(avg)}</div></div>`;const grouped={};[...list].sort((a,b)=>rdate(b).localeCompare(rdate(a))).forEach(r=>(grouped[rdate(r)]??=[]).push(r));const keys=Object.keys(grouped);detailRecords.innerHTML=keys.length?keys.map(k=>{const rows=grouped[k],sum=rows.reduce((a,r)=>a+r.amount,0);return `<div class="dateGroup"><div class="dateHead"><span>${k}</span><span class="dateTotal">當日 ${money(sum)}</span></div>${rows.map(r=>`<div class="record"><div class="rleft"><b>${ICON[r.category]||'🧾'} ${r.category}</b><div class="rnote">${r.note||'無備註'}</div></div><div><span class="ramount">-${money(r.amount)}</span> <button class="del" data-id="${r.id}">刪除</button></div></div>`).join('')}</div>`}).join(''):`<div class="empty">${detailMode==='week'?'本週':'本月'}目前還沒有消費紀錄。</div>`;detailRecords.querySelectorAll('.del').forEach(b=>b.addEventListener('click',()=>deleteRecord(b.dataset.id)));weekTab.classList.toggle('active',detailMode==='week');monthTab.classList.toggle('active',detailMode==='month')}
function render(){const d=new Date(),[bs,be]=bounds(d),mk=month(d),mrList=state.records.filter(r=>(r.month||rdate(r).slice(0,7))===mk),wrList=state.records.filter(r=>rdate(r)>=date(bs)&&rdate(r)<=date(be)),mspent=mrList.reduce((a,r)=>a+r.amount,0),wspent=wrList.reduce((a,r)=>a+r.amount,0),mrem=state.monthlyBudget-mspent,wrem=state.weeklyBudget-wspent,mpct=state.monthlyBudget?mspent/state.monthlyBudget*100:0,wpct=state.weeklyBudget?wspent/state.weeklyBudget*100:0,mdays=Math.max(1,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate()+1),wdays=Math.max(1,Math.round((be-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000)+1);
period.textContent=`${d.getFullYear()} 年 ${d.getMonth()+1} 月`;weekRange.textContent=`${bs.getMonth()+1}/${bs.getDate()} ～ ${be.getMonth()+1}/${be.getDate()}`;wb.textContent=money(state.weeklyBudget);ws.textContent=money(wspent);wr.textContent=money(wrem);wd.textContent=money(wrem/wdays);mb.textContent=money(state.monthlyBudget);ms.textContent=money(mspent);mr.textContent=money(mrem);md.textContent=money(mrem/mdays);wp.textContent=`已使用 ${Math.round(wpct)}%`;mp.textContent=`已使用 ${Math.round(mpct)}%`;[wr,wd].forEach(x=>x.classList.toggle('negative',wrem<0));[mr,md].forEach(x=>x.classList.toggle('negative',mrem<0));wstatus.textContent=wrem<0?'本週已超支':wpct>=80?'本週快用完了':'本週預算充足';mstatus.textContent=mrem<0?'本月已超支':mpct>=80?'本月接近上限':'本月預算充足';wstatus.className='tiny '+(wrem<0?'status-bad':wpct>=80?'status-warn':'status-ok');mstatus.className='tiny '+(mrem<0?'status-bad':mpct>=80?'status-warn':'status-ok');weeklyBudget.value=state.weeklyBudget;monthlyBudget.value=state.monthlyBudget;wbar.style.width=Math.min(100,wpct)+'%';mbar.style.width=Math.min(100,mpct)+'%';wprog.classList.toggle('over',wpct>100);mprog.classList.toggle('over',mpct>100);
const sums={};mrList.forEach(r=>sums[r.category]=(sums[r.category]||0)+r.amount);summary.innerHTML=Object.keys(sums).length?Object.entries(sums).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="mini"><span>${ICON[c]||'🧾'} ${c}</span><b>${money(v)}</b></div>`).join(''):'<div class="empty" style="grid-column:1/-1">記帳後會顯示分類統計。</div>';
const recent=[...mrList].sort((a,b)=>String(b.time||b.date).localeCompare(String(a.time||a.date))).slice(0,10);records.innerHTML=recent.length?recent.map(r=>`<div class="record"><div class="rleft"><b>${ICON[r.category]||'🧾'} ${r.category}</b><div class="rnote">${r.note||'無備註'} · ${rdate(r)}</div></div><div><span class="ramount">-${money(r.amount)}</span> <button class="del" data-id="${r.id}">刪除</button></div></div>`).join(''):'<div class="empty">還沒有紀錄，先記第一筆吧。</div>';records.querySelectorAll('.del').forEach(b=>b.addEventListener('click',()=>deleteRecord(b.dataset.id)));
let text=`本週還剩 ${money(wrem)}，目前節奏不錯。`;if(mrem<0)text=`😄 本月已超支 ${money(Math.abs(mrem))}！錢包目前正在「瘦身計畫」中。赤字照實記下來最重要，後面幾天少一點衝動消費，就能慢慢拉回來。`;else if(wrem<0)text=`😅 本週已超支 ${money(Math.abs(wrem))}，這週的生活費提早下班了！本月目前還剩 ${money(mrem)}，接下來幾天稍微收斂一下就好。`;else if(wpct>=80)text=`本週預算已使用超過 80%，接下來幾天稍微控制一下；本月目前還剩 ${money(mrem)}。`;else if(mpct>=80)text=`本週狀況還可以，但本月總預算已使用超過 80%，月底前留意一下整體支出。`;advice.textContent=text;adviceBox.classList.toggle('over',mrem<0||wrem<0);renderDetail(wrList,mrList,bs,be)}
category.addEventListener('change',notes);notePreset.addEventListener('change',custom);addBtn.addEventListener('click',add);amount.addEventListener('keydown',e=>{if(e.key==='Enter')add()});saveBudget.addEventListener('click',()=>{state.weeklyBudget=Math.max(0,Number(weeklyBudget.value)||0);state.monthlyBudget=Math.max(0,Number(monthlyBudget.value)||0);save();render()});clearBtn.addEventListener('click',()=>{if(confirm('確定要清除全部記帳紀錄嗎？')){state.records=[];save();render()}});weekTab.addEventListener('click',()=>{detailMode='week';render()});monthTab.addEventListener('click',()=>{detailMode='month';render()});
let deferredPrompt=null;const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;if(!standalone){const isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent);if(isiOS){installBox.classList.add('show');installHint.textContent='iPhone：用 Safari 的「分享」→「加入主畫面」。';installBtn.textContent='查看步驟';installBtn.onclick=()=>alert('iPhone 安裝步驟：\n1. 用 Safari 開啟本頁\n2. 點下方「分享」\n3. 選「加入主畫面」\n4. 點「加入」完成');}else installBtn.style.display='none'}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBox.classList.add('show');installBtn.style.display='block';installBtn.textContent='安裝 App';installBtn.onclick=async()=>{deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}});window.addEventListener('appinstalled',()=>installBox.classList.remove('show'));if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
setup();render();
</script></body></html>
