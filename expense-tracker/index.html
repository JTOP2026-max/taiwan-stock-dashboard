<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>大學生生活費記帳</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--blue:#3b82f6;--blue2:#2563eb;--red:#dc2626;--green:#16a34a;--amber:#d97706;--shadow:0 8px 24px rgba(15,23,42,.06)}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:920px;margin:0 auto;padding:18px 14px 40px}
    header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
    h1{font-size:24px;margin:0 0 4px}.sub{color:var(--muted);font-size:14px}.month{font-weight:700;color:var(--blue2)}
    .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
    .metric{padding:14px}.metric .label{font-size:13px;color:var(--muted)}.metric .value{font-size:20px;font-weight:800;margin-top:7px}.metric .tiny{font-size:12px;color:var(--muted);margin-top:5px}
    .card{padding:16px;margin-top:14px}.card h2{font-size:17px;margin:0 0 4px}.hint{font-size:13px;color:var(--muted);margin-bottom:14px}
    .formgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.control{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;font-size:16px;outline:none}.control:focus{border-color:#93c5fd;box-shadow:0 0 0 3px #dbeafe}
    .btn{border:0;border-radius:13px;padding:12px 16px;font-size:16px;font-weight:800;cursor:pointer}.primary{width:100%;margin-top:12px;background:var(--blue);color:#fff}.primary:active{background:var(--blue2)}.secondary{background:#fff;border:1px solid var(--line);color:var(--text)}.danger{color:var(--red);background:#fff;border:1px solid #fecaca}
    .custom{display:none;margin-top:8px}.custom.show{display:block}
    .budgetrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.budgetrow .btn{height:46px}
    .progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:var(--blue);width:0%;transition:.25s}.progress.over>div{background:var(--red)}
    .summarygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}.mini{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.mini .name{font-size:13px;color:var(--muted)}.mini .sum{font-size:17px;font-weight:800;margin-top:6px}
    .records{display:flex;flex-direction:column;gap:8px}.record{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px}.left{min-width:0}.rtitle{font-weight:800}.rnote{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.amount{font-weight:800;white-space:nowrap}.del{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;text-decoration:underline;padding:2px 0 2px 8px}
    .empty{border:1px dashed #cbd5e1;border-radius:14px;padding:18px;text-align:center;color:var(--muted);font-size:14px}.callout{background:#eff6ff;border:1px solid #bfdbfe;border-radius:16px;padding:14px;margin-top:14px}.callout b{color:#1d4ed8}.msg{font-size:13px;color:var(--green);min-height:18px;margin-top:8px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.smallbtn{font-size:13px;padding:8px 10px;border-radius:10px}
    .footer{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}.status-ok{color:var(--green)}.status-warn{color:var(--amber)}.status-bad{color:var(--red)}
    @media(max-width:720px){.grid4{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.summarygrid{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;flex-direction:column}.wrap{padding:12px 10px 32px}.metric .value{font-size:18px}.card{border-radius:16px;padding:14px}.budgetrow{grid-template-columns:1fr}.budgetrow .btn{width:100%}}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div><h1>大學生生活費記帳</h1><div class="sub">每天 3 秒記一筆，慢慢養成金錢習慣。</div></div>
      <div class="month" id="monthLabel"></div>
    </header>

    <section class="grid4">
      <div class="metric"><div class="label">本月生活費</div><div class="value" id="budgetDisplay">NT$ 12,000</div><div class="tiny">可自行調整</div></div>
      <div class="metric"><div class="label">本月已花</div><div class="value" id="spentDisplay">NT$ 0</div><div class="tiny" id="spentPct">0% 預算</div></div>
      <div class="metric"><div class="label">目前剩餘</div><div class="value" id="remainingDisplay">NT$ 12,000</div><div class="tiny" id="remainingStatus">預算充足</div></div>
      <div class="metric"><div class="label">每日可花</div><div class="value" id="dailyDisplay">NT$ 0</div><div class="tiny">依本月剩餘天數</div></div>
    </section>

    <section class="card">
      <h2>快速記一筆</h2>
      <div class="hint">輸入金額、選分類、選常用備註；也可以自己輸入。</div>
      <div class="formgrid">
        <div class="field"><label for="amount">金額</label><input id="amount" class="control" type="number" min="1" inputmode="numeric" placeholder="例如 85"></div>
        <div class="field"><label for="category">分類</label><select id="category" class="control"></select></div>
        <div class="field"><label for="notePreset">備註</label><select id="notePreset" class="control"></select><input id="noteCustom" class="control custom" type="text" placeholder="自行輸入備註"></div>
      </div>
      <button class="btn primary" id="addBtn" type="button">＋ 記一筆</button>
      <div class="msg" id="msg" aria-live="polite"></div>
    </section>

    <section class="card">
      <h2>本月預算設定</h2><div class="hint">例如家裡每月給 12,000 元生活費。</div>
      <div class="budgetrow"><div class="field"><label for="budgetInput">本月可用金額</label><input id="budgetInput" class="control" type="number" min="0" inputmode="numeric"></div><button class="btn secondary" id="budgetBtn" type="button">更新預算</button></div>
      <div class="progress" id="progress"><div id="progressBar"></div></div>
    </section>

    <section class="card">
      <div class="toolbar"><div><h2>分類統計</h2><div class="hint" style="margin:3px 0 0">看看錢主要花在哪裡。</div></div></div>
      <div class="summarygrid" id="summary"></div>
    </section>

    <section class="card">
      <div class="toolbar"><div><h2>最近紀錄</h2><div class="hint" style="margin:3px 0 0">資料只存在這台裝置的瀏覽器。</div></div><button class="btn danger smallbtn" id="clearBtn" type="button">清除全部</button></div>
      <div class="records" id="records"></div>
    </section>

    <section class="callout"><b>本月小提醒</b><div id="advice" style="margin-top:6px;font-size:14px"></div></section>
    <div class="footer">第一版｜手機、平板、電腦皆可使用</div>
  </main>

<script>
const CATEGORY_NOTES={
  '餐飲':['7-11','全家','萊爾富','星巴克','早餐','午餐','晚餐','飲料','自行輸入'],
  '交通':['公車','捷運','台鐵','高鐵','YouBike','計程車','加油','停車','自行輸入'],
  '生活用品':['超商','全聯','家樂福','寶雅','藥妝','日用品','洗衣','自行輸入'],
  '學習':['課本','文具','影印','線上課程','考試報名','社團活動','自行輸入'],
  '娛樂':['電影','聚餐','唱歌','遊戲','展覽','旅遊','購物','自行輸入'],
  '住宿':['宿舍費','水電','網路','洗衣','寢具','修繕','自行輸入'],
  '其他':['醫療','禮物','手續費','臨時支出','自行輸入']
};
const ICON={'餐飲':'🍱','交通':'🚌','生活用品':'🧴','學習':'📚','娛樂':'🎬','住宿':'🏠','其他':'🧾'};
const KEY='collegeExpenseTrackerV1';
let state=loadState();
function loadState(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object')return {budget:Number(s.budget)||12000,records:Array.isArray(s.records)?s.records:[]};}catch(e){}return {budget:12000,records:[]};}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function money(n){const sign=n<0?'-':'';return sign+'NT$ '+Math.abs(Math.round(n)).toLocaleString('zh-TW');}
function monthKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function currentRecords(){const k=monthKey();return state.records.filter(r=>r.month===k);}
function setupCategories(){const c=document.getElementById('category');c.innerHTML=Object.keys(CATEGORY_NOTES).map(x=>`<option value="${x}">${ICON[x]} ${x}</option>`).join('');updateNotes();}
function updateNotes(){const cat=document.getElementById('category').value;const s=document.getElementById('notePreset');s.innerHTML=CATEGORY_NOTES[cat].map(x=>`<option value="${x}">${x}</option>`).join('');toggleCustom();}
function toggleCustom(){const v=document.getElementById('notePreset').value;document.getElementById('noteCustom').classList.toggle('show',v==='自行輸入');}
function addRecord(){const amount=Number(document.getElementById('amount').value);if(!amount||amount<=0){showMsg('請先輸入正確金額。',false);document.getElementById('amount').focus();return;}const cat=document.getElementById('category').value;const preset=document.getElementById('notePreset').value;const custom=document.getElementById('noteCustom').value.trim();const note=preset==='自行輸入'?(custom||'其他'):preset;const now=new Date();state.records.push({id:Date.now()+Math.random(),amount,category:cat,note,month:monthKey(now),time:now.toISOString()});save();document.getElementById('amount').value='';document.getElementById('noteCustom').value='';showMsg(`已記下 ${money(amount)}｜${cat}・${note}`,true);render();document.getElementById('amount').focus();}
function showMsg(text,ok){const m=document.getElementById('msg');m.textContent=text;m.style.color=ok?'var(--green)':'var(--red)';}
function render(){const rs=currentRecords();const spent=rs.reduce((a,r)=>a+r.amount,0);const remain=state.budget-spent;const d=new Date();const days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();const left=Math.max(1,days-d.getDate()+1);const daily=Math.max(0,remain/left);const pct=state.budget>0?spent/state.budget*100:0;
 document.getElementById('monthLabel').textContent=`${d.getFullYear()} 年 ${d.getMonth()+1} 月`;
 document.getElementById('budgetDisplay').textContent=money(state.budget);document.getElementById('spentDisplay').textContent=money(spent);document.getElementById('remainingDisplay').textContent=money(remain);document.getElementById('dailyDisplay').textContent=money(daily);document.getElementById('spentPct').textContent=`已使用 ${Math.round(pct)}% 預算`;document.getElementById('budgetInput').value=state.budget;
 const st=document.getElementById('remainingStatus');st.className='tiny '+(remain<0?'status-bad':pct>=80?'status-warn':'status-ok');st.textContent=remain<0?'本月已超支':pct>=80?'接近預算上限':'預算充足';
 const bar=document.getElementById('progressBar');bar.style.width=Math.min(100,pct)+'%';document.getElementById('progress').classList.toggle('over',pct>100);
 const sums={};rs.forEach(r=>sums[r.category]=(sums[r.category]||0)+r.amount);const summary=document.getElementById('summary');const entries=Object.entries(sums).sort((a,b)=>b[1]-a[1]);summary.innerHTML=entries.length?entries.map(([c,v])=>`<div class="mini"><div class="name">${ICON[c]} ${c}</div><div class="sum">${money(v)}</div></div>`).join(''):'<div class="empty" style="grid-column:1/-1">記帳後會自動顯示分類統計。</div>';
 const box=document.getElementById('records');box.innerHTML=rs.length?[...rs].reverse().slice(0,30).map(r=>{const dt=new Date(r.time);const t=dt.toLocaleDateString('zh-TW')+' '+dt.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});return `<div class="record"><div class="left"><div class="rtitle">${ICON[r.category]} ${r.category}・${escapeHtml(r.note)}</div><div class="rnote">${t}</div></div><div style="display:flex;align-items:center"><div class="amount">-${money(r.amount)}</div><button class="del" data-id="${r.id}">刪除</button></div></div>`}).join(''):'<div class="empty">還沒有紀錄，先記第一筆吧。</div>';
 box.querySelectorAll('.del').forEach(b=>b.addEventListener('click',()=>{state.records=state.records.filter(r=>String(r.id)!==b.dataset.id);save();render();}));
 const advice=document.getElementById('advice');if(spent===0)advice.textContent='今天先從第一筆開始。記帳不需要很複雜，持續比詳細更重要。';else if(remain<0)advice.textContent=`本月已超出預算 ${money(Math.abs(remain))}，接下來可先減少非必要娛樂或額外支出。`;else if(pct>=80)advice.textContent=`本月預算已使用 ${Math.round(pct)}%，目前剩 ${money(remain)}，接下來平均每天建議控制在 ${money(daily)} 左右。`;else advice.textContent=`目前還剩 ${money(remain)}，接下來平均每天可用約 ${money(daily)}。保持每天記帳就很好。`;
}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
document.getElementById('category').addEventListener('change',updateNotes);document.getElementById('notePreset').addEventListener('change',toggleCustom);document.getElementById('addBtn').addEventListener('click',addRecord);document.getElementById('amount').addEventListener('keydown',e=>{if(e.key==='Enter')addRecord()});document.getElementById('noteCustom').addEventListener('keydown',e=>{if(e.key==='Enter')addRecord()});document.getElementById('budgetBtn').addEventListener('click',()=>{const v=Number(document.getElementById('budgetInput').value);if(Number.isNaN(v)||v<0)return;state.budget=v;save();showMsg('本月預算已更新。',true);render();});document.getElementById('clearBtn').addEventListener('click',()=>{if(confirm('確定要清除本月全部記帳紀錄嗎？')){const k=monthKey();state.records=state.records.filter(r=>r.month!==k);save();render();showMsg('本月紀錄已清除。',true);}});
setupCategories();render();
</script>
</body>
</html>
