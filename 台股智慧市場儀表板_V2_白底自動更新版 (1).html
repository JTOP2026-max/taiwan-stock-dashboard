<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>index.html</title><style>
:root{--bg:#f4f7fb;--card:#fff;--text:#182230;--muted:#667085;--line:#e4e9f0;--up:#df1f26;--down:#16834b;--blue:#2166d1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;position:sticky;top:0;z-index:5}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{font-size:27px;font-weight:900}.sub,.small{font-size:12px;color:var(--muted)}.btn{background:#2166d1;color:#fff;border:0;border-radius:8px;padding:9px 13px;font-weight:800}.wrap{max-width:1500px;margin:auto;padding:15px}.sec{font-size:20px;font-weight:900;margin:12px 0 8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.g3{display:grid;grid-template-columns:1fr 2fr 2fr;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 4px 14px #243b5310}.label{font-size:12px;color:var(--muted)}.num{font-size:28px;font-weight:900;margin:5px 0}.up{color:var(--up)}.down{color:var(--down)}.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.gauge{height:190px;position:relative;display:flex;justify-content:center;overflow:hidden}.arc{position:absolute;top:28px;width:250px;height:125px;border-radius:250px 250px 0 0;background:conic-gradient(from 270deg,#2ca35c,#8bc34a,#f2c94c,#f47721,#df1f26)}.arc:after{content:"";position:absolute;left:26px;right:26px;bottom:0;height:98px;background:#fff;border-radius:200px 200px 0 0}.needle{position:absolute;bottom:30px;width:4px;height:87px;background:#111;transform-origin:50% 100%;z-index:2}.needle:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#111;bottom:-6px;left:-4px}.gv{position:absolute;bottom:7px;font-size:28px;font-weight:900;z-index:3}.gs{position:absolute;bottom:-13px;font-weight:800;z-index:3}.legend{font-size:12px;line-height:1.75}.tablewrap{overflow:auto}.portfolio table{width:100%;min-width:950px;border-collapse:collapse;font-size:13px}.portfolio th,.portfolio td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.portfolio th:first-child,.portfolio td:first-child{text-align:left}.badge{padding:4px 8px;border-radius:999px;background:#edf3fc;font-size:11px;font-weight:800}.bar{height:11px;border-radius:20px;background:linear-gradient(90deg,#2ca35c,#8bc34a,#f2c94c,#f47721,#df1f26);position:relative;margin-top:7px}.pin{position:absolute;top:-5px;width:4px;height:21px;background:#111}.advice{background:#fff9e8;border-color:#f0d27b}footer{text-align:center;color:#7b8794;font-size:12px;padding:20px}@media(max-width:1000px){.g4,.g3{grid-template-columns:1fr 1fr}}@media(max-width:620px){.g4,.g3{grid-template-columns:1fr}.title{font-size:21px}.wrap{padding:9px}}
</style></head><body><header><div class="top"><div><div class="title">台股智慧市場儀表板 V2 <span class="badge">白底實用版</span></div><div class="sub">大盤＋籌碼＋情緒儀表＋盤面強弱＋持股估值｜手機／桌機同一網址</div></div><div><span id="updated" class="small">資料載入中…</span>　<button class="btn" onclick="loadData()">↻ 重新整理</button></div></div></header><main class="wrap"><div class="sec">① 大盤核心</div><div class="g4" id="core"></div><div class="sec">② 籌碼與市場情緒</div><div class="g3" id="sent"></div><div class="sec">③ 盤面強弱</div><div class="g3" id="breadth"></div><div class="sec">④ 我的持股｜估值模組</div><div class="card portfolio"><b>持股可新增／刪除｜汰弱留強</b><div class="tablewrap" id="holdings"></div></div><div class="sec">⑤ 持股估值總覽</div><div class="g4" id="summary"></div></main><footer>本儀表板僅供參考，非投資建議。投資有風險，請審慎評估。正式版可接雲端資料 API／每日排程。</footer><script>
const D={updated:"2026/08/14 07:30",core:{idx:46021.48,chg:503.41,pct:1.11,vol:"1.05 兆",volPct:2.35,fut:46389,futChg:364,futPct:.79,basis:3.52},inst:{t:907.56,f:756.95,tr:.01,d:150.60},pc:1.16,fg:78,b:{u:800,d:989,lu:38,ld:4},leaders:[["台積電 2330",2345,35,1.52],["聯發科 2454",4225,78,1.88],["鴻海 2317",1845,-12,-.65],["台達電 2308",1885,27,1.45],["廣達 2382",2620,-33,-1.24]],h:[{c:"3008",n:"大立光",p:4355,ch:55,pc:1.28,s:45,a:2350,e:188.02,pe:23.16,v:[2985.1,3864.2,4830.2,5796.3,6675.4]},{c:"6510",n:"精測",p:2800,ch:40,pc:1.45,s:250,a:3121.69,e:42.45,pe:65.96,v:[2391,3095.1,3868.9,4642.7,5346.8]},{c:"3044",n:"健鼎",p:441.5,ch:-3.5,pc:-.79,s:1000,a:429.2,e:25.15,pe:20.99,v:[264,396,528,660,792]},{c:"2454",n:"聯發科",p:4020,ch:-20,pc:-.5,s:55,a:3333.82,e:60.67,pe:66.26,v:[2377.1,3077.2,3846.5,4615.8,5315.8]}]};
const F=n=>Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2}),P=n=>(n>=0?'+':'')+F(n)+'%';
function pcs(v){return v<.7?['極度偏空','down']:v<1?['偏空','down']:v<1.2?['正常範圍','']:v<1.35?['偏多','up']:v<1.45?['偏多注意','up']:['最後煙火／戒慎貪婪','up']}function fgs(v){return v<30?['市場恐懼','down']:v<50?['市場溫和','down']:v<65?['市場樂觀','up']:v<80?['市場樂觀追價','up']:['市場無腦多／小心最後煙火','up']}
function gauge(v,min,max,type){let a=-90+(Math.max(min,Math.min(max,v))-min)/(max-min)*180,s=type==='pc'?pcs(v):fgs(v);return `<div class="gauge"><div class="arc"></div><div class="needle" style="transform:rotate(${a}deg)"></div><div class="gv ${s[1]}">${type==='pc'?F(v):F(v)+'/100'}</div><div class="gs ${s[1]}">${s[0]}</div></div>`}
function render(){document.getElementById('updated').textContent='資料日期／更新：'+D.updated;let c=D.core;document.getElementById('core').innerHTML=[["加權指數",F(c.idx),`▲ ${F(c.chg)}　${P(c.pct)}`],["成交值",c.vol,`較昨日 ${P(c.volPct)}`],["台指期夜盤",F(c.fut),`▲ ${F(c.futChg,0)}　${P(c.futPct)}`],["台指期正逆價差",(c.basis>=0?'+':'')+F(c.basis),c.basis>=0?'正價差':'逆價差']].map((x,i)=>`<div class="card"><div class="label">${x[0]}</div><div class="num ${i===1?'': 'up'}">${x[1]}</div><div class="${i===1&&c.volPct<0?'down':i===1?'up':'up'}">${x[2]}</div></div>`).join('');let ps=pcs(D.pc),fs=fgs(D.fg);document.getElementById('sent').innerHTML=`<div class="card"><div class="label">三大法人｜最新交易日</div><div class="num up">+${F(D.inst.t)} 億</div><div class="row"><span>外資及陸資</span><b class="up">+${F(D.inst.f)} 億</b></div><div class="row"><span>投信</span><b>${D.inst.tr>=0?'+':''}${F(D.inst.tr)} 億</b></div><div class="row"><span>自營商</span><b class="up">+${F(D.inst.d)} 億</b></div></div><div class="card"><div class="label">P/C Ratio｜選擇權未平倉</div>${gauge(D.pc,.5,2,'pc')}<div class="row"><span>目前區間</span><b class="${ps[1]}">${ps[0]}</b></div><div class="legend">&lt;0.70 極度偏空　0.70–1.00 偏空　1.00–1.20 正常<br>1.20–1.35 偏多　1.36–1.45 偏多注意　≥1.45 最後煙火</div></div><div class="card"><div class="label">台股 Fear & Greed｜模型分數</div>${gauge(D.fg,0,100,'fg')}<div class="legend">0–30 恐懼　30–50 溫和　50–65 樂觀　66–79 樂觀追價　≥80 無腦多</div><div class="card advice"><b class="${fs[1]}">${fs[0]}</b><br><span class="small">情緒越熱，越要留意追價風險與估值安全邊際。</span></div></div>`;document.getElementById('breadth').innerHTML=`<div class="card"><div class="label">上漲／下跌家數</div><div class="num"><span class="up">${F(D.b.u)}</span> / <span class="down">${F(D.b.d)}</span></div><div class="row"><span>漲停</span><b class="up">${F(D.b.lu)}</b></div><div class="row"><span>跌停</span><b class="down">${F(D.b.ld)}</b></div></div><div class="card"><div class="label">權值股觀察</div>${D.leaders.map(r=>`<div class="row"><span>${r[0]}</span><span>${F(r[1])}　<b class="${r[2]>=0?'up':'down'}">${r[2]>=0?'▲':'▼'} ${F(Math.abs(r[2]))}　${P(r[3])}</b></span></div>`).join('')}</div><div class="card"><div class="label">市場結構</div><div class="num up">偏多，但非全面普漲</div><div class="small">電子權值與部分 AI／半導體族群帶動指數；盤面仍存在類股與個股分化。</div><div class="bar"><div class="pin" style="left:72%"></div></div></div>`;let total=0,pnl=0,rows='';D.h.forEach(h=>{let gain=(h.p-h.a)*h.s,rate=h.a?(h.p/h.a-1)*100:0;total+=h.p*h.s;pnl+=gain;let st=h.p<=h.v[0]?'特價':h.p<=h.v[1]?'便宜價':h.p<=h.v[3]?'合理價':'昂貴價';let pos=Math.max(0,Math.min(100,(h.p-h.v[0])/(h.v[4]-h.v[0])*100));rows+=`<tr><td><b>${h.c} ${h.n}</b></td><td>${F(h.p)}</td><td class="${h.ch>=0?'up':'down'}">${h.ch>=0?'▲':'▼'} ${F(Math.abs(h.ch))}<br>${P(h.pc)}</td><td>${F(h.s)}</td><td>${F(h.a)}</td><td class="${gain>=0?'up':'down'}">${gain>=0?'+':''}${F(gain)}<br>${P(rate)}</td><td>${F(h.e)}</td><td>${F(h.pe)}</td><td><span class="badge">${st}</span></td></tr><tr><td colspan="9"><div class="small">特價 ${F(h.v[0])}　便宜價 ${F(h.v[1])}　合理價(下緣) ${F(h.v[2])}　合理價(上緣) ${F(h.v[3])}　昂貴價 ${F(h.v[4])}</div><div class="bar"><div class="pin" style="left:${pos}%"></div></div></td></tr>`});document.getElementById('holdings').innerHTML=`<table><thead><tr><th>股票</th><th>現價</th><th>漲跌</th><th>持股</th><th>成本均價</th><th>損益</th><th>EPS</th><th>本益比</th><th>估值</th></tr></thead><tbody>${rows}</tbody></table>`;let low=D.h.filter(h=>h.p<=h.v[1]).length,fair=D.h.filter(h=>h.p>h.v[1]&&h.p<=h.v[3]).length,high=D.h.length-low-fair;document.getElementById('summary').innerHTML=[["總持股市值",F(total)+' 元'],["總未實現損益",(pnl>=0?'+':'')+F(pnl)+' 元'],["合理價以下",low+' 檔'],["合理價區間",fair+' 檔']].map((x,i)=>`<div class="card"><div class="label">${x[0]}</div><div class="num ${i===1?'up':''}">${x[1]}</div><div class="small">${i===1?'整體持股損益':i===2?'偏低估':i===3?'中性估值':'目前估值總覽'}</div></div>`).join('')+`<div class="card advice"><div class="label">今日操作提醒</div><div class="num">${fs[0]}</div><div class="small">若市場情緒偏熱，優先檢查昂貴價持股，汰弱留強。</div></div>`}
async function loadData(){try{let ep=localStorage.getItem('TW_V2_DATA_ENDPOINT')||'data.json';let r=await fetch(ep,{cache:'no-store'});if(r.ok){Object.assign(D,await r.json())}}catch(e){}render()}render();setInterval(loadData,30*60*1000);
</script></body></html>
